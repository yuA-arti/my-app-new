<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>推しシーンログ</title>
  <!-- スマホでも安定して高速読み込みできるCDN(cdnjs)に変更 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 軽量化したSVGアイコン
    const IconBook = () => <svg className="w-6 h-6 text-blue-600 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>;
    const IconSearch = () => <svg className="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
    const IconUp = () => <svg className="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7" /></svg>;
    const IconDown = () => <svg className="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>;
    const IconTrash = () => <svg className="w-4 h-4 text-red-500 hover:text-red-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
    const IconTrashSmall = () => <svg className="w-3.5 h-3.5 text-gray-400 hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
    const IconBookmark = () => <svg className="w-3.5 h-3.5 text-gray-600 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>;
    const IconLock = () => <svg className="w-10 h-10 text-blue-500 mb-2 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>;

    const CORRECT_PASSWORD = '1234';

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        try {
          return sessionStorage.getItem('manga_log_auth') === 'true';
        } catch(e) {
          return false;
        }
      });
      const [passwordInput, setPasswordInput] = useState('');
      const [passError, setPassError] = useState(false);

      const [works, setWorks] = useState(() => {
        try {
          const saved = localStorage.getItem('manga_scene_works');
          return saved ? JSON.parse(saved) : [
            {
              id: 1,
              title: '葬送のフリーレン',
              author: '山田鐘人 / アベツカサ',
              image: '',
              site: 'サンデーうぇぶり',
              tags: ['ファンタジー', 'ドラマ'],
              memo: '旅の過程での人間模様が美しい',
              scenes: [
                {
                  id: 101,
                  chapter: '第1話',
                  page: '12p',
                  memo: 'ヒンメルの葬儀でのフリーレンの涙。「なんでもっと知ろうとしなかったんだろう」',
                  tags: ['名言', '感動']
                }
              ]
            }
          ];
        } catch(e) {
          return [];
        }
      });

      const [searchWord, setSearchWord] = useState('');
      const [selectedTag, setSelectedTag] = useState('');
      const [selectedSite, setSelectedSite] = useState('');

      const [expandedMap, setExpandedMap] = useState({});

      const [newTitle, setNewTitle] = useState('');
      const [newAuthor, setNewAuthor] = useState('');
      const [newImage, setNewImage] = useState('');
      const [newSite, setNewSite] = useState('');
      const [newWorkTags, setNewWorkTags] = useState('');
      const [newWorkMemo, setNewWorkMemo] = useState('');

      const [sceneInputs, setSceneInputs] = useState({});

      useEffect(() => {
        try {
          localStorage.setItem('manga_scene_works', JSON.stringify(works));
        } catch(e) {}
      }, [works]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === CORRECT_PASSWORD) {
          setIsAuthenticated(true);
          try {
            sessionStorage.setItem('manga_log_auth', 'true');
          } catch(e) {}
          setPassError(false);
        } else {
          setPassError(true);
        }
      };

      const addWork = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const newId = Date.now();
        const item = {
          id: newId,
          title: newTitle,
          author: newAuthor,
          image: newImage,
          site: newSite,
          tags: newWorkTags ? newWorkTags.split(',').map(t => t.trim()).filter(Boolean) : [],
          memo: newWorkMemo,
          scenes: []
        };
        setWorks([item, ...works]);
        setExpandedMap(prev => ({ ...prev, [newId]: true }));
        setNewTitle(''); setNewAuthor(''); setNewImage(''); setNewSite(''); setNewWorkTags(''); setNewWorkMemo('');
      };

      const deleteWork = (id, e) => {
        e.stopPropagation();
        if (window.confirm('この作品と登録されたシーンをすべて削除しますか？')) {
          setWorks(works.filter(w => w.id !== id));
        }
      };

      const toggleExpand = (id) => {
        setExpandedMap(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const addScene = (workId) => {
        const input = sceneInputs[workId] || {};
        if (!input.memo?.trim()) return;

        const newScene = {
          id: Date.now(),
          chapter: input.chapter || '',
          page: input.page || '',
          memo: input.memo,
          tags: input.tags ? input.tags.split(',').map(t => t.trim()).filter(Boolean) : []
        };

        setWorks(works.map(w => {
          if (w.id === workId) {
            return { ...w, scenes: [...w.scenes, newScene] };
          }
          return w;
        }));

        setSceneInputs({ ...sceneInputs, [workId]: { chapter: '', page: '', memo: '', tags: '' } });
      };

      const deleteScene = (workId, sceneId) => {
        setWorks(works.map(w => {
          if (w.id === workId) {
            return { ...w, scenes: w.scenes.filter(s => s.id !== sceneId) };
          }
          return w;
        }));
      };

      const handleSceneInputChange = (workId, field, value) => {
        setSceneInputs({
          ...sceneInputs,
          [workId]: { ...(sceneInputs[workId] || {}), [field]: value }
        });
      };

      const allSites = Array.from(new Set(works.map(w => w.site).filter(Boolean)));
      const allTags = Array.from(new Set([
        ...works.flatMap(w => w.tags || []),
        ...works.flatMap(w => (w.scenes || []).flatMap(s => s.tags || []))
      ]));

      const isSearching = searchWord !== '' || selectedTag !== '' || selectedSite !== '';

      const filteredWorks = works.filter(w => {
        const matchWord = searchWord === '' || 
          (w.title && w.title.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.author && w.author.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.memo && w.memo.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.scenes && w.scenes.some(s => s.memo && s.memo.toLowerCase().includes(searchWord.toLowerCase())));

        const matchSite = selectedSite === '' || w.site === selectedSite;

        const matchTag = selectedTag === '' || 
          (w.tags && w.tags.includes(selectedTag)) ||
          (w.scenes && w.scenes.some(s => s.tags && s.tags.includes(selectedTag)));

        return matchWord && matchSite && matchTag;
      });

      if (!isAuthenticated) {
        return (
          <div className="flex justify-center items-center min-h-screen bg-gray-100 p-4">
            <form onSubmit={handleLogin} className="bg-white p-6 rounded-xl shadow-md text-center w-80">
              <IconLock />
              <h2 className="text-xl font-bold mb-4">推しシーンログ</h2>
              <input
                type="password"
                placeholder="パスワードを入力"
                value={passwordInput}
                onChange={(e) => setPasswordInput(e.target.value)}
                className="w-full p-2 rounded border mb-2 text-base focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              {passError && <p className="text-red-500 text-xs mb-2">パスワードが違います</p>}
              <button type="submit" className="w-full p-2.5 bg-blue-600 text-white rounded font-bold text-sm hover:bg-blue-700">
                解除する
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto p-3 text-gray-800 min-h-screen">
          <h1 className="flex items-center gap-2 text-xl font-bold mb-3 text-gray-900">
            <IconBook /> 推しシーンログ
          </h1>

          <div className="bg-white p-3 rounded-lg shadow-sm mb-3 border">
            <div className="flex flex-col sm:flex-row gap-2">
              <div className="flex items-center gap-2 border rounded px-2 py-1.5 bg-white">
                <IconSearch />
                <input
                  type="text"
                  placeholder="フリーワード検索..."
                  value={searchWord}
                  onChange={e => setSearchWord(e.target.value)}
                  className="w-full border-none outline-none text-sm"
                />
              </div>

              <div className="flex gap-2">
                <select value={selectedSite} onChange={e => setSelectedSite(e.target.value)} className="flex-1 p-1.5 text-xs rounded border bg-white">
                  <option value="">すべての掲載サイト</option>
                  {allSites.map(s => <option key={s} value={s}>{s}</option>)}
                </select>

                <select value={selectedTag} onChange={e => setSelectedTag(e.target.value)} className="flex-1 p-1.5 text-xs rounded border bg-white">
                  <option value="">すべてのタグ</option>
                  {allTags.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            </div>
          </div>

          <details className="bg-white p-3 rounded-lg shadow-sm mb-3 border">
            <summary className="font-bold cursor-pointer text-blue-600 text-sm">＋ 新しい作品を登録する</summary>
            <form onSubmit={addWork} className="flex flex-col gap-2 mt-3 text-xs">
              <div className="flex gap-2">
                <input type="text" placeholder="作品タイトル（必須）" value={newTitle} onChange={e => setNewTitle(e.target.value)} className="flex-[2] p-2 rounded border text-sm" />
                <input type="text" placeholder="著者名" value={newAuthor} onChange={e => setNewAuthor(e.target.value)} className="flex-1 p-2 rounded border text-sm" />
              </div>
              <div className="flex gap-2">
                <input type="text" placeholder="掲載サイト（例：ピッコマ）" value={newSite} onChange={e => setNewSite(e.target.value)} className="flex-1 p-2 rounded border text-sm" />
                <input type="text" placeholder="作品タグ（カンマ区切り）" value={newWorkTags} onChange={e => setNewWorkTags(e.target.value)} className="flex-1 p-2 rounded border text-sm" />
              </div>
              <input type="text" placeholder="画像URL（任意）" value={newImage} onChange={e => setNewImage(e.target.value)} className="p-2 rounded border text-sm" />
              <textarea placeholder="作品全体のメモ" value={newWorkMemo} onChange={e => setNewWorkMemo(e.target.value)} className="p-2 rounded border h-16 text-sm" />
              <button type="submit" className="p-2.5 bg-blue-600 text-white rounded font-bold text-sm mt-1">作品を保存</button>
            </form>
          </details>

          <div className="flex flex-col gap-3">
            {filteredWorks.map(work => {
              const isOpen = isSearching ? true : !!expandedMap[work.id];

              return (
                <div key={work.id} className="bg-white rounded-lg shadow-sm border overflow-hidden">
                  <div 
                    onClick={() => toggleExpand(work.id)} 
                    className={`p-3 flex gap-3 cursor-pointer select-none active:bg-gray-100 ${isOpen ? 'border-b' : ''}`}
                  >
                    {work.image ? (
                      <img src={work.image} alt={work.title} className="w-12 h-16 object-cover rounded flex-shrink-0" />
                    ) : (
                      <div className="w-12 h-16 bg-gray-100 rounded flex items-center justify-center flex-shrink-0">
                        <IconBook />
                      </div>
                    )}

                    <div className="flex-1 min-w-0">
                      <div className="flex justify-between items-start gap-1">
                        <div className="truncate">
                          <h2 className="font-bold text-sm text-blue-600 truncate">{work.title}</h2>
                          {work.author && <span className="text-[11px] text-gray-500 mr-2">{work.author}</span>}
                          {work.site && <span className="text-[10px] bg-blue-50 text-blue-600 px-1 py-0.5 rounded">{work.site}</span>}
                        </div>
                        <div className="flex items-center gap-1 flex-shrink-0">
                          <span className="text-[10px] text-gray-400">{work.scenes?.length || 0}件</span>
                          {isOpen ? <IconUp /> : <IconDown />}
                          <button onClick={(e) => deleteWork(work.id, e)} className="p-1">
                            <IconTrash />
                          </button>
                        </div>
                      </div>

                      {work.memo && <p className="text-xs text-gray-600 mt-1 line-clamp-2">{work.memo}</p>}

                      {work.tags && work.tags.length > 0 && (
                        <div className="flex gap-1 flex-wrap mt-1.5">
                          {work.tags.map((t, idx) => (
                            <span key={idx} className="text-[9px] bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">#{t}</span>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>

                  {isOpen && (
                    <div className="bg-gray-50 p-3">
                      <h3 className="text-xs font-bold text-gray-600 mb-2 flex items-center gap-1">
                        <IconBookmark /> 推しシーン ({work.scenes?.length || 0})
                      </h3>

                      <div className="flex flex-col gap-2 mb-3">
                        {work.scenes && work.scenes.map(scene => (
                          <div key={scene.id} className="bg-white border p-2.5 rounded shadow-sm">
                            <div className="flex justify-between mb-1">
                              <span className="text-xs font-bold text-blue-600">
                                {scene.chapter} {scene.page && `(${scene.page})`}
                              </span>
                              <button onClick={() => deleteScene(work.id, scene.id)} className="p-0.5">
                                <IconTrashSmall />
                              </button>
                            </div>
                            <p className="text-xs text-gray-800 whitespace-pre-wrap mb-1">{scene.memo}</p>
                            {scene.tags && scene.tags.length > 0 && (
                              <div className="flex gap-1 flex-wrap">
                                {scene.tags.map((st, idx) => (
                                  <span key={idx} className="text-[9px] text-teal-600 bg-teal-50 px-1.5 py-0.5 rounded">#{st}</span>
                                ))}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>

                      <div className="border-t border-dashed pt-2.5 text-xs">
                        <div className="flex gap-1 mb-1.5">
                          <input
                            type="text"
                            placeholder="話数（例: 12話）"
                            value={sceneInputs[work.id]?.chapter || ''}
                            onChange={e => handleSceneInputChange(work.id, 'chapter', e.target.value)}
                            className="flex-1 p-2 rounded border text-xs"
                          />
                          <input
                            type="text"
                            placeholder="ページ"
                            value={sceneInputs[work.id]?.page || ''}
                            onChange={e => handleSceneInputChange(work.id, 'page', e.target.value)}
                            className="w-20 p-2 rounded border text-xs"
                          />
                        </div>
                        <input
                          type="text"
                          placeholder="タグ（カンマ区切り：名言, 伏線）"
                          value={sceneInputs[work.id]?.tags || ''}
                          onChange={e => handleSceneInputChange(work.id, 'tags', e.target.value)}
                          className="w-full p-2 rounded border mb-1.5 text-xs"
                        />
                        <div className="flex gap-1">
                          <input
                            type="text"
                            placeholder="推しシーン・メモ（必須）"
                            value={sceneInputs[work.id]?.memo || ''}
                            onChange={e => handleSceneInputChange(work.id, 'memo', e.target.value)}
                            className="flex-1 p-2 rounded border text-xs"
                          />
                          <button
                            onClick={() => addScene(work.id)}
                            className="px-3 py-2 bg-green-600 text-white rounded font-bold text-xs"
                          >
                            追加
                          </button>
                        </div>
                      </div>

                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // スマホブラウザでのレンダリング安全処理
    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>
</html>
