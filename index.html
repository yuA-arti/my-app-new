<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マンガ名シーンログ</title>
  <!-- React, ReactDOM, Babel, Tailwind CSS, Lucide Icons の読み込み -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CORRECT_PASSWORD = '3010';

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem('manga_log_auth') === 'true';
      });
      const [passwordInput, setPasswordInput] = useState('');
      const [passError, setPassError] = useState(false);

      const [works, setWorks] = useState(() => {
        const saved = localStorage.getItem('manga_scene_works');
        return saved ? JSON.parse(saved) : [
          {
            id: 1,
            title: '葬送のフリーレン',
            author: '山田鐘人 / アベツカサ',
            image: '',
            site: 'サンデーうぇぶり',
            tags: ['ファンタジー', 'ドラマ'],
            memo: '旅の過程での人間模様が美しい',
            scenes: [
              { id: 101, chapter: '第1話', page: '12p', memo: 'ヒンメルの葬儀でのフリーレンの涙。「なんでもっと知ろうとしなかったんだろう」', tags: ['名言', '感動'] }
            ]
          }
        ];
      });

      const [searchWord, setSearchWord] = useState('');
      const [expandedWorks, setExpandedWorks] = useState({ 1: true });

      // フォーム入力用ステート
      const [showAddWorkModal, setShowAddWorkModal] = useState(false);
      const [newTitle, setNewTitle] = useState('');
      const [newAuthor, setNewAuthor] = useState('');
      const [newSite, setNewSite] = useState('');
      const [newMemo, setNewMemo] = useState('');
      const [newTags, setNewTags] = useState('');

      const [activeWorkForScene, setActiveWorkForScene] = useState(null);
      const [newChapter, setNewChapter] = useState('');
      const [newPage, setNewPage] = useState('');
      const [newSceneMemo, setNewSceneMemo] = useState('');
      const [newSceneTags, setNewSceneTags] = useState('');

      useEffect(() => {
        localStorage.setItem('manga_scene_works', JSON.stringify(works));
      }, [works]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === CORRECT_PASSWORD) {
          setIsAuthenticated(true);
          sessionStorage.setItem('manga_log_auth', 'true');
          setPassError(false);
        } else {
          setPassError(true);
        }
      };

      const toggleExpand = (id) => {
        setExpandedWorks(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handleAddWork = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const newWork = {
          id: Date.now(),
          title: newTitle,
          author: newAuthor,
          site: newSite,
          memo: newMemo,
          tags: newTags ? newTags.split(',').map(t => t.trim()) : [],
          scenes: []
        };
        setWorks([newWork, ...works]);
        setNewTitle(''); setNewAuthor(''); setNewSite(''); setNewMemo(''); setNewTags('');
        setShowAddWorkModal(false);
      };

      const handleDeleteWork = (id) => {
        if (confirm('この作品を削除しますか？')) {
          setWorks(works.filter(w => w.id !== id));
        }
      };

      const handleAddScene = (e) => {
        e.preventDefault();
        if (!activeWorkForScene) return;
        const newScene = {
          id: Date.now(),
          chapter: newChapter,
          page: newPage,
          memo: newSceneMemo,
          tags: newSceneTags ? newSceneTags.split(',').map(t => t.trim()) : []
        };
        setWorks(works.map(w => {
          if (w.id === activeWorkForScene) {
            return { ...w, scenes: [...w.scenes, newScene] };
          }
          return w;
        }));
        setNewChapter(''); setNewPage(''); setNewSceneMemo(''); setNewSceneTags('');
        setActiveWorkForScene(null);
      };

      const filteredWorks = works.filter(w => {
        const matchTitle = w.title.toLowerCase().includes(searchWord.toLowerCase());
        const matchAuthor = w.author.toLowerCase().includes(searchWord.toLowerCase());
        const matchMemo = w.memo.toLowerCase().includes(searchWord.toLowerCase());
        const matchScene = w.scenes.some(s => s.memo.toLowerCase().includes(searchWord.toLowerCase()));
        return matchTitle || matchAuthor || matchMemo || matchScene;
      });

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white p-6 rounded-xl shadow-md w-full max-w-md">
              <h1 className="text-xl font-bold text-center mb-4">🔒 パスワード認証</h1>
              <form onSubmit={handleLogin} className="space-y-4">
                <input
                  type="password"
                  value={passwordInput}
                  onChange={(e) => setPasswordInput(e.target.value)}
                  placeholder="パスワードを入力 (3010)"
                  className="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                {passError && <p className="text-red-500 text-sm">パスワードが正しくありません</p>}
                <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold">
                  ログイン
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto p-4 pb-20">
          <header className="bg-white p-4 rounded-xl shadow-sm mb-4 border flex justify-between items-center">
            <h1 className="text-xl font-bold text-gray-800">📖 マンガ名シーンログ</h1>
            <button 
              onClick={() => setShowAddWorkModal(true)}
              className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1"
            >
              ＋ 作品追加
            </button>
          </header>

          {/* 検索バー */}
          <div className="mb-4">
            <input
              type="text"
              placeholder="作品名・作者名・メモで検索..."
              value={searchWord}
              onChange={(e) => setSearchWord(e.target.value)}
              className="w-full p-2.5 border rounded-xl shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
            />
          </div>

          {/* 作品一覧 */}
          <div className="space-y-4">
            {filteredWorks.map((work) => {
              const isExpanded = expandedWorks[work.id];
              return (
                <div key={work.id} className="bg-white rounded-xl shadow-sm border overflow-hidden">
                  <div className="p-4 border-b bg-gray-50/50">
                    <div className="flex justify-between items-start">
                      <div>
                        <h2 className="text-lg font-bold text-blue-600">{work.title}</h2>
                        <p className="text-xs text-gray-500 mt-0.5">{work.author} {work.site && `(${work.site})`}</p>
                      </div>
                      <div className="flex gap-2">
                        <button 
                          onClick={() => handleDeleteWork(work.id)} 
                          className="text-gray-400 hover:text-red-500 text-xs px-1"
                        >
                          削除
                        </button>
                        <button 
                          onClick={() => toggleExpand(work.id)} 
                          className="text-gray-500 text-xs bg-white border px-2 py-1 rounded"
                        >
                          {isExpanded ? '閉じに' : '開く'}
                        </button>
                      </div>
                    </div>

                    {work.tags && work.tags.length > 0 && (
                      <div className="flex flex-wrap gap-1 mt-2">
                        {work.tags.map((tag, idx) => (
                          <span key={idx} className="bg-blue-50 text-blue-600 text-[10px] px-2 py-0.5 rounded-full font-medium">
                            #{tag}
                          </span>
                        ))}
                      </div>
                    )}

                    {work.memo && (
                      <p className="text-xs text-gray-600 mt-2 bg-white p-2 rounded border border-gray-100">
                        {work.memo}
                      </p>
                    )}
                  </div>

                  {/* 名シーンアコーディオン */}
                  {isExpanded && (
                    <div className="p-4 space-y-3 bg-white">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-xs font-bold text-gray-400">記録した名シーン ({work.scenes.length})</span>
                        <button 
                          onClick={() => setActiveWorkForScene(work.id)}
                          className="text-xs text-blue-600 font-bold bg-blue-50 px-2 py-1 rounded hover:bg-blue-100"
                        >
                          ＋ シーン追加
                        </button>
                      </div>

                      {work.scenes.length === 0 ? (
                        <p className="text-xs text-gray-400 italic">まだシーンが登録されていません</p>
                      ) : (
                        work.scenes.map((scene) => (
                          <div key={scene.id} className="bg-gray-50 p-2.5 rounded-lg border border-gray-100 text-xs">
                            <div className="font-bold text-gray-700 mb-1">
                              {scene.chapter} <span className="text-blue-500">{scene.page}</span>
                            </div>
                            <p className="text-gray-800 leading-relaxed">{scene.memo}</p>
                            {scene.tags && scene.tags.length > 0 && (
                              <div className="flex gap-1 mt-1.5">
                                {scene.tags.map((t, i) => (
                                  <span key={i} className="text-[9px] text-gray-400">#{t}</span>
                                ))}
                              </div>
                            )}
                          </div>
                        ))
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* 作品追加モーダル */}
          {showAddWorkModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl p-5 w-full max-w-sm space-y-3">
                <h3 className="font-bold text-gray-800">新規作品の追加</h3>
                <input type="text" placeholder="作品タイトル *" value={newTitle} onChange={e => setNewTitle(e.target.value)} className="w-full p-2 border rounded text-xs" />
                <input type="text" placeholder="作者名" value={newAuthor} onChange={e => setNewAuthor(e.target.value)} className="w-full p-2 border rounded text-xs" />
                <input type="text" placeholder="掲載サイト / アプリ" value={newSite} onChange={e => setNewSite(e.target.value)} className="w-full p-2 border rounded text-xs" />
                <input type="text" placeholder="タグ (カンマ区切り)" value={newTags} onChange={e => setNewTags(e.target.value)} className="w-full p-2 border rounded text-xs" />
                <textarea placeholder="全体メモ" value={newMemo} onChange={e => setNewMemo(e.target.value)} className="w-full p-2 border rounded text-xs h-20" />
                <div className="flex gap-2 justify-end pt-2">
                  <button onClick={() => setShowAddWorkModal(false)} className="px-3 py-1.5 text-xs text-gray-500">キャンセル</button>
                  <button onClick={handleAddWork} className="px-4 py-1.5 text-xs bg-blue-600 text-white font-bold rounded">保存</button>
                </div>
              </div>
            </div>
          )}

          {/* シーン追加モーダル */}
          {activeWorkForScene && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl p-5 w-full max-w-sm space-y-3">
                <h3 className="font-bold text-gray-800">名シーンの追加</h3>
                <input type="text" placeholder="話数 (例: 第5話)" value={newChapter} onChange={e => setNewChapter(e.target.value)} className="w-full p-2 border rounded text-xs" />
                <input type="text" placeholder="ページ/コマ (例: p12 / 3コマ目)" value={newPage} onChange={e => setNewPage(e.target.value)} className="w-full p-2 border rounded text-xs" />
                <input type="text" placeholder="タグ (カンマ区切り)" value={newSceneTags} onChange={e => setNewSceneTags(e.target.value)} className="w-full p-2 border rounded text-xs" />
                <textarea placeholder="名シーンの内容・感想" value={newSceneMemo} onChange={e => setNewSceneMemo(e.target.value)} className="w-full p-2 border rounded text-xs h-24" />
                <div className="flex gap-2 justify-end pt-2">
                  <button onClick={() => setActiveWorkForScene(null)} className="px-3 py-1.5 text-xs text-gray-500">キャンセル</button>
                  <button onClick={handleAddScene} className="px-4 py-1.5 text-xs bg-blue-600 text-white font-bold rounded">保存</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
