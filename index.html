<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Favorite Scenes（名シーン記録帳）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // SVGアイコン
    const IconBook = () => <svg className="w-6 h-6 text-blue-600 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>;
    const IconSearch = () => <svg className="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
    const IconUp = () => <svg className="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7" /></svg>;
    const IconDown = () => <svg className="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>;
    const IconPencil = () => (
      <svg className="w-4 h-4 text-blue-600 hover:text-blue-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
      </svg>
    );
    const IconPencilSmall = () => (
      <svg className="w-3.5 h-3.5 text-blue-500 hover:text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
      </svg>
    );
    const IconTrash = () => <svg className="w-4 h-4 text-red-500 hover:text-red-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
    const IconTrashSmall = () => <svg className="w-3.5 h-3.5 text-gray-400 hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
    const IconBookmark = () => <svg className="w-3.5 h-3.5 text-gray-600 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>;
    const IconLock = () => <svg className="w-10 h-10 text-blue-500 mb-2 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>;

    const CORRECT_PASSWORD = '1234';

    // 画像圧縮処理関数
    const compressImage = (file, maxWidth = 800, maxHeight = 800, quality = 0.7) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = (error) => reject(error);
        };
        reader.onerror = (error) => reject(error);
      });
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        try { return sessionStorage.getItem('manga_log_auth') === 'true'; } catch(e) { return false; }
      });
      const [passwordInput, setPasswordInput] = useState('');
      const [passError, setPassError] = useState(false);

      const [works, setWorks] = useState(() => {
        try {
          const saved = localStorage.getItem('manga_scene_works');
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });

      const [searchWord, setSearchWord] = useState('');
      const [selectedTag, setSelectedTag] = useState('');
      const [selectedSite, setSelectedSite] = useState('');

      const [expandedMap, setExpandedMap] = useState({});
      const [expandedTitles, setExpandedTitles] = useState({});
      const [expandedMemos, setExpandedMemos] = useState({});

      const [newTitle, setNewTitle] = useState('');
      const [newAuthor, setNewAuthor] = useState('');
      const [newImage, setNewImage] = useState('');
      const [newSite, setNewSite] = useState('');
      const [newWorkTags, setNewWorkTags] = useState('');
      const [newWorkMemo, setNewWorkMemo] = useState('');

      const [editingWorkId, setEditingWorkId] = useState(null);
      const [editWorkData, setEditWorkData] = useState({});

      const [sceneInputs, setSceneInputs] = useState({});

      const [editingSceneId, setEditingSceneId] = useState(null);
      const [editSceneData, setEditSceneData] = useState({});

      const [previewImageUrl, setPreviewImageUrl] = useState(null);

      const fileInputRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('manga_scene_works', JSON.stringify(works));
        } catch(e) {
          alert('保存容量の上限を超えた可能性があります。古い画像を削除するかバックアップを取ってください。');
        }
      }, [works]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === CORRECT_PASSWORD) {
          setIsAuthenticated(true);
          try { sessionStorage.setItem('manga_log_auth', 'true'); } catch(e) {}
          setPassError(false);
        } else {
          setPassError(true);
        }
      };

      const handleImageChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            setNewImage(compressed);
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }
        }
      };

      const handleEditImageChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            setEditWorkData({ ...editWorkData, image: compressed });
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }
        }
      };

      const handleSceneImageChange = async (workId, e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            handleSceneInputChange(workId, 'image', compressed);
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }
        }
      };

      const handleEditSceneImageChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            setEditSceneData({ ...editSceneData, image: compressed });
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }
        }
      };

      const addWork = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const newId = Date.now();
        const item = {
          id: newId,
          title: newTitle,
          author: newAuthor,
          image: newImage,
          site: newSite,
          tags: newWorkTags ? newWorkTags.split(',').map(t => t.trim()).filter(Boolean) : [],
          memo: newWorkMemo,
          scenes: []
        };
        setWorks([item, ...works]);
        setExpandedMap(prev => ({ ...prev, [newId]: true }));
        setNewTitle(''); setNewAuthor(''); setNewImage(''); setNewSite(''); setNewWorkTags(''); setNewWorkMemo('');
      };

      const startEditWork = (work, e) => {
        e.stopPropagation();
        setEditingWorkId(work.id);
        setEditWorkData({
          title: work.title || '',
          author: work.author || '',
          site: work.site || '',
          image: work.image || '',
          tags: (work.tags || []).join(', '),
          memo: work.memo || ''
        });
      };

      const saveEditWork = (workId, e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!editWorkData.title.trim()) return;

        setWorks(works.map(w => {
          if (w.id === workId) {
            return {
              ...w,
              title: editWorkData.title,
              author: editWorkData.author,
              site: editWorkData.site,
              image: editWorkData.image,
              tags: editWorkData.tags ? editWorkData.tags.split(',').map(t => t.trim()).filter(Boolean) : [],
              memo: editWorkData.memo
            };
          }
          return w;
        }));
        setEditingWorkId(null);
      };

      const deleteWork = (id, e) => {
        e.stopPropagation();
        if (window.confirm('この作品と登録されたBookmarkをすべて削除しますか？')) {
          setWorks(works.filter(w => w.id !== id));
        }
      };

      const toggleExpand = (id) => {
        if (editingWorkId === id) return;
        setExpandedMap(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleTitleExpand = (id, e) => {
        e.stopPropagation();
        setExpandedTitles(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleMemoExpand = (id, e) => {
        e.stopPropagation();
        setExpandedMemos(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const addScene = (workId, e) => {
        if (e) e.preventDefault();
        const input = sceneInputs[workId] || {};
        if (!input.memo?.trim() && !input.image) return;

        const newScene = {
          id: Date.now(),
          chapter: input.chapter || '',
          page: input.page || '',
          memo: input.memo || '',
          image: input.image || '',
          tags: input.tags ? input.tags.split(',').map(t => t.trim()).filter(Boolean) : []
        };

        setWorks(works.map(w => {
          if (w.id === workId) {
            return { ...w, scenes: [...(w.scenes || []), newScene] };
          }
          return w;
        }));

        setSceneInputs({ ...sceneInputs, [workId]: { chapter: '', page: '', memo: '', image: '', tags: '' } });
      };

      const startEditScene = (scene, e) => {
        e.stopPropagation();
        setEditingSceneId(scene.id);
        setEditSceneData({
          chapter: scene.chapter || '',
          page: scene.page || '',
          memo: scene.memo || '',
          image: scene.image || '',
          tags: (scene.tags || []).join(', ')
        });
      };

      const saveEditScene = (workId, sceneId, e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!editSceneData.memo.trim() && !editSceneData.image) return;

        setWorks(works.map(w => {
          if (w.id === workId) {
            return {
              ...w,
              scenes: w.scenes.map(s => {
                if (s.id === sceneId) {
                  return {
                    ...s,
                    chapter: editSceneData.chapter,
                    page: editSceneData.page,
                    memo: editSceneData.memo,
                    image: editSceneData.image,
                    tags: editSceneData.tags ? editSceneData.tags.split(',').map(t => t.trim()).filter(Boolean) : []
                  };
                }
                return s;
              })
            };
          }
          return w;
        }));
        setEditingSceneId(null);
      };

      const deleteScene = (workId, sceneId) => {
        setWorks(works.map(w => {
          if (w.id === workId) {
            return { ...w, scenes: w.scenes.filter(s => s.id !== sceneId) };
          }
          return w;
        }));
      };

      const handleSceneInputChange = (workId, field, value) => {
        setSceneInputs({
          ...sceneInputs,
          [workId]: { ...(sceneInputs[workId] || {}), [field]: value }
        });
      };

      const exportBackup = async () => {
        const jsonString = JSON.stringify(works, null, 2);
        const fileName = `favorite_scenes_backup_${new Date().toISOString().slice(0, 10)}.json`;
        const blob = new Blob([jsonString], { type: 'application/json' });
        const file = new File([blob], fileName, { type: 'application/json' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Favorite Scenes バックアップ',
              text: 'Favorite Scenesのバックアップデータです。'
            });
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", URL.createObjectURL(blob));
        downloadAnchor.setAttribute("download", fileName);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importBackup = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (Array.isArray(parsed) && window.confirm('現在のデータを上書きして復元しますか？')) {
                setWorks(parsed);
                alert('データを復元しました！');
              }
            } catch(err) {
              alert('ファイルの読み込みに失敗しました。正しいバックアップファイルを選択してください。');
            }
          };
        }
      };

      const allSites = Array.from(new Set(works.map(w => w.site).filter(Boolean)));
      const allTags = Array.from(new Set([
        ...works.flatMap(w => w.tags || []),
        ...works.flatMap(w => (w.scenes || []).flatMap(s => s.tags || []))
      ]));

      const isSearching = searchWord !== '' || selectedTag !== '' || selectedSite !== '';

      const filteredWorks = works.filter(w => {
        const matchWord = searchWord === '' || 
          (w.title && w.title.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.author && w.author.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.memo && w.memo.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.scenes && w.scenes.some(s => s.memo && s.memo.toLowerCase().includes(searchWord.toLowerCase())));

        const matchSite = selectedSite === '' || w.site === selectedSite;

        const matchTag = selectedTag === '' || 
          (w.tags && w.tags.includes(selectedTag)) ||
          (w.scenes && w.scenes.some(s => s.tags && s.tags.includes(selectedTag)));

        return matchWord && matchSite && matchTag;
      });

      if (!isAuthenticated) {
        return (
          <div className="flex justify-center items-center min-h-screen bg-gray-100 p-4">
            <form onSubmit={handleLogin} className="bg-white p-6 rounded-xl shadow-md text-center w-80">
              <IconLock />
              <h2 className="text-xl font-bold mb-4">Favorite Scenes<br/><span className="text-sm font-normal text-gray-500">（名シーン記録帳）</span></h2>
              <input
                type="password"
                placeholder="パスワードを入力"
                value={passwordInput}
                onChange={(e) => setPasswordInput(e.target.value)}
                className="w-full p-2 rounded border mb-2 text-base focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              {passError && <p className="text-red-500 text-xs mb-2">パスワードが違います</p>}
              <button type="submit" className="w-full p-2.5 bg-blue-600 text-white rounded font-bold text-sm hover:bg-blue-700">
                解除する
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto p-3 text-gray-800 min-h-screen pb-12">
          <div className="flex justify-between items-center mb-3">
            <h1 className="flex items-center gap-2 text-lg sm:text-xl font-bold text-gray-900">
              <IconBook /> Favorite Scenes <span className="text-xs sm:text-sm font-normal text-gray-500">（名シーン記録帳）</span>
            </h1>
            <div className="flex gap-1.5 text-[10px]">
              <button onClick={exportBackup} className="bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-gray-700 font-bold">
                保存(書き出し)
              </button>
              <button onClick={() => fileInputRef.current?.click()} className="bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-gray-700 font-bold">
                復元(読み込み)
              </button>
              <input type="file" ref={fileInputRef} onChange={importBackup} accept=".json" className="hidden" />
            </div>
          </div>

          {/* 検索・フィルター */}
          <div className="bg-white p-3 rounded-lg shadow-sm mb-3 border">
            <div className="flex flex-col sm:flex-row gap-2">
              <div className="flex items-center gap-2 border rounded px-2 py-1.5 bg-white">
                <IconSearch />
                <input
                  type="text"
                  placeholder="フリーワード検索..."
                  value={searchWord}
                  onChange={e => setSearchWord(e.target.value)}
                  className="w-full border-none outline-none text-sm"
                />
              </div>

              <div className="flex gap-2">
                <select value={selectedSite} onChange={e => setSelectedSite(e.target.value)} className="flex-1 p-1.5 text-xs rounded border bg-white">
                  <option value="">すべての掲載サイト</option>
                  {allSites.map(s => <option key={s} value={s}>{s}</option>)}
                </select>

                <select value={selectedTag} onChange={e => setSelectedTag(e.target.value)} className="flex-1 p-1.5 text-xs rounded border bg-white">
                  <option value="">すべてのタグ</option>
                  {allTags.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            </div>
          </div>

          {/* 新規作品登録フォーム */}
          <details className="bg-white p-3 rounded-lg shadow-sm mb-3 border">
            <summary className="font-bold cursor-pointer text-blue-600 text-sm">＋ 新しい作品を登録する</summary>
            <form onSubmit={addWork} className="flex flex-col gap-2 mt-3 text-xs">
              <div className="flex gap-2">
                <input type="text" placeholder="作品タイトル（必須）" value={newTitle} onChange={e => setNewTitle(e.target.value)} className="flex-[2] p-2 rounded border text-sm" />
                <input type="text" placeholder="著者名" value={newAuthor} onChange={e => setNewAuthor(e.target.value)} className="flex-1 p-2 rounded border text-sm" />
              </div>
              <div className="flex gap-2">
                <input type="text" placeholder="掲載サイト（例：ピッコマ）" value={newSite} onChange={e => setNewSite(e.target.value)} className="flex-1 p-2 rounded border text-sm" />
                <input type="text" placeholder="作品タグ（カンマ区切り）" value={newWorkTags} onChange={e => setNewWorkTags(e.target.value)} className="flex-1 p-2 rounded border text-sm" />
              </div>
              
              <div className="flex flex-col gap-1">
                <label className="font-bold text-gray-600">表紙画像を選択 (自動圧縮):</label>
                <input 
                  type="file" 
                  accept="image/*" 
                  onChange={handleImageChange} 
                  className="p-1 border rounded text-xs bg-white"
                />
                {newImage && (
                  <div className="flex items-center gap-2 mt-1">
                    <img src={newImage} alt="プレビュー" className="w-10 h-14 object-cover rounded border" />
                    <button type="button" onClick={() => setNewImage('')} className="text-red-500 text-xs underline">画像を削除</button>
                  </div>
                )}
              </div>

              <textarea placeholder="作品全体のメモ" value={newWorkMemo} onChange={e => setNewWorkMemo(e.target.value)} className="p-2 rounded border h-16 text-sm" />
              <button type="submit" className="p-2.5 bg-blue-600 text-white rounded font-bold text-sm mt-1">作品を保存</button>
            </form>
          </details>

          {/* 作品一覧 */}
          <div className="flex flex-col gap-3">
            {filteredWorks.map(work => {
              const isOpen = isSearching ? true : !!expandedMap[work.id];
              const isEditing = editingWorkId === work.id;
              const isTitleExpanded = !!expandedTitles[work.id];
              const isMemoExpanded = !!expandedMemos[work.id];
              const currentInput = sceneInputs[work.id] || {};

              return (
                <div key={work.id} className="bg-white rounded-lg shadow-sm border overflow-hidden">
                  
                  {/* 作品編集モード画面 */}
                  {isEditing ? (
                    <form onSubmit={(e) => saveEditWork(work.id, e)} className="p-3 bg-blue-50/50 flex flex-col gap-2 text-xs">
                      <h4 className="font-bold text-blue-600 mb-1">作品情報の修正</h4>
                      <div className="flex gap-2">
                        <input type="text" placeholder="タイトル" value={editWorkData.title} onChange={e => setEditWorkData({...editWorkData, title: e.target.value})} className="flex-[2] p-1.5 rounded border text-xs" />
                        <input type="text" placeholder="著者名" value={editWorkData.author} onChange={e => setEditWorkData({...editWorkData, author: e.target.value})} className="flex-1 p-1.5 rounded border text-xs" />
                      </div>
                      <div className="flex gap-2">
                        <input type="text" placeholder="掲載サイト" value={editWorkData.site} onChange={e => setEditWorkData({...editWorkData, site: e.target.value})} className="flex-1 p-1.5 rounded border text-xs" />
                        <input type="text" placeholder="タグ (カンマ区切り)" value={editWorkData.tags} onChange={e => setEditWorkData({...editWorkData, tags: e.target.value})} className="flex-1 p-1.5 rounded border text-xs" />
                      </div>
                      
                      <div className="flex flex-col gap-1">
                        <label className="font-bold text-gray-600">画像を変更 (自動圧縮):</label>
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={handleEditImageChange} 
                          className="p-1 border rounded text-xs bg-white"
                        />
                        {editWorkData.image && (
                          <div className="flex items-center gap-2 mt-1">
                            <img src={editWorkData.image} alt="プレビュー" className="w-10 h-14 object-cover rounded border" />
                            <button type="button" onClick={() => setEditWorkData({...editWorkData, image: ''})} className="text-red-500 text-xs underline">画像を削除</button>
                          </div>
                        )}
                      </div>

                      <textarea placeholder="作品メモ" value={editWorkData.memo} onChange={e => setEditWorkData({...editWorkData, memo: e.target.value})} className="p-1.5 rounded border text-xs h-14" />
                      <div className="flex justify-end gap-2 mt-1">
                        <button type="button" onClick={() => setEditingWorkId(null)} className="px-3 py-1 bg-gray-300 text-gray-700 rounded">キャンセル</button>
                        <button type="submit" className="px-3 py-1 bg-blue-600 text-white rounded font-bold">更新を保存</button>
                      </div>
                    </form>
                  ) : (
                    /* 通常の作品表示ヘッダー */
                    <div 
                      onClick={() => toggleExpand(work.id)} 
                      className={`p-3 flex gap-3 cursor-pointer select-none active:bg-gray-100 ${isOpen ? 'border-b' : ''}`}
                    >
                      {work.image ? (
                        <img 
                          src={work.image} 
                          alt={work.title} 
                          onClick={(e) => {
                            e.stopPropagation();
                            setPreviewImageUrl(work.image);
                          }}
                          className="w-12 h-16 object-cover rounded flex-shrink-0 hover:opacity-80 transition-opacity cursor-zoom-in" 
                        />
                      ) : (
                        <div className="w-12 h-16 bg-gray-100 rounded flex items-center justify-center flex-shrink-0">
                          <IconBook />
                        </div>
                      )}

                      <div className="flex-1 min-w-0">
                        <div className="flex justify-between items-start gap-1">
                          <div className="min-w-0 flex-1">
                            <h2 
                              onClick={(e) => toggleTitleExpand(work.id, e)}
                              className={`font-bold text-sm text-blue-600 active:opacity-75 ${isTitleExpanded ? 'whitespace-normal break-words' : 'truncate'}`}
                              title="タップで全文表示/省略"
                            >
                              {work.title}
                            </h2>
                            <div className="flex items-center gap-1.5 flex-wrap mt-0.5">
                              {work.author && <span className="text-[11px] text-gray-500">{work.author}</span>}
                              {work.site && <span className="text-[10px] bg-blue-50 text-blue-600 px-1 py-0.5 rounded">{work.site}</span>}
                            </div>
                          </div>
                          
                          <div className="flex items-center gap-1 flex-shrink-0">
                            <span className="text-[10px] text-gray-400 mr-1">{work.scenes?.length || 0}件</span>
                            <button onClick={(e) => startEditWork(work, e)} title="作品情報を編集" className="p-1 hover:bg-gray-200 rounded">
                              <IconPencil />
                            </button>
                            <button onClick={(e) => deleteWork(work.id, e)} title="削除" className="p-1 hover:bg-gray-200 rounded">
                              <IconTrash />
                            </button>
                            {isOpen ? <IconUp /> : <IconDown />}
                          </div>
                        </div>

                        {work.memo && (
                          <p 
                            onClick={(e) => toggleMemoExpand(work.id, e)}
                            className={`text-xs text-gray-600 mt-1 active:opacity-75 ${isMemoExpanded ? 'whitespace-normal break-words' : 'line-clamp-2'}`}
                            title="タップで全文表示/省略"
                          >
                            {work.memo}
                          </p>
                        )}

                        {work.tags && work.tags.length > 0 && (
                          <div className="flex gap-1 flex-wrap mt-1.5">
                            {work.tags.map((t, idx) => (
                              <span key={idx} className="text-[9px] bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">#{t}</span>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* Bookmark一覧・追加フォーム */}
                  {isOpen && !isEditing && (
                    <div className="bg-gray-50 p-3">
                      <h3 className="text-xs font-bold text-gray-600 mb-2 flex items-center gap-1">
                        <IconBookmark /> Bookmark ({work.scenes?.length || 0})
                      </h3>

                      <div className="flex flex-col gap-2 mb-3">
                        {work.scenes && work.scenes.map(scene => {
                          const isSceneEditing = editingSceneId === scene.id;

                          return isSceneEditing ? (
                            /* Bookmark編集フォーム */
                            <form key={scene.id} onSubmit={(e) => saveEditScene(work.id, scene.id, e)} className="bg-blue-50/70 border border-blue-200 p-2.5 rounded shadow-sm text-xs flex flex-col gap-1.5">
                              <div className="flex gap-1">
                                <input
                                  type="text"
                                  placeholder="話数"
                                  value={editSceneData.chapter}
                                  onChange={e => setEditSceneData({...editSceneData, chapter: e.target.value})}
                                  className="flex-1 p-1.5 rounded border text-xs"
                                />
                                <input
                                  type="text"
                                  placeholder="ページ"
                                  value={editSceneData.page}
                                  onChange={e => setEditSceneData({...editSceneData, page: e.target.value})}
                                  className="w-20 p-1.5 rounded border text-xs"
                                />
                              </div>
                              <input
                                type="text"
                                placeholder="タグ"
                                value={editSceneData.tags}
                                onChange={e => setEditSceneData({...editSceneData, tags: e.target.value})}
                                className="w-full p-1.5 rounded border text-xs"
                              />
                              <textarea
                                placeholder="名シーンのメモ"
                                value={editSceneData.memo}
                                onChange={e => setEditSceneData({...editSceneData, memo: e.target.value})}
                                className="w-full p-1.5 rounded border text-xs h-14"
                              />
                              <div className="flex flex-col gap-1">
                                <label className="font-bold text-gray-600">画像変更:</label>
                                <input 
                                  type="file" 
                                  accept="image/*" 
                                  onChange={handleEditSceneImageChange} 
                                  className="p-1 border rounded text-xs bg-white"
                                />
                                {editSceneData.image && (
                                  <div className="flex items-center gap-2 mt-1">
                                    <img src={editSceneData.image} alt="プレビュー" className="w-12 h-12 object-cover rounded border" />
                                    <button type="button" onClick={() => setEditSceneData({...editSceneData, image: ''})} className="text-red-500 text-xs underline">画像を削除</button>
                                  </div>
                                )}
                              </div>
                              <div className="flex justify-end gap-1.5 mt-1">
                                <button type="button" onClick={() => setEditingSceneId(null)} className="px-2.5 py-1 bg-gray-200 rounded text-gray-700">キャンセル</button>
                                <button type="submit" className="px-2.5 py-1 bg-blue-600 text-white rounded font-bold">保存</button>
                              </div>
                            </form>
                          ) : (
                            /* 通常のBookmark表示 */
                            <div key={scene.id} className="bg-white p-2.5 rounded border shadow-sm flex gap-2.5 text-xs">
                              {scene.image && (
                                <img 
                                  src={scene.image} 
                                  alt="シーン" 
                                  onClick={() => setPreviewImageUrl(scene.image)}
                                  className="w-14 h-14 object-cover rounded border flex-shrink-0 cursor-zoom-in hover:opacity-80 transition-opacity" 
                                />
                              )}
                              <div className="flex-1 min-w-0">
                                <div className="flex justify-between items-start gap-1">
                                  <div className="font-bold text-blue-600 text-[11px] flex gap-2">
                                    {scene.chapter && <span>{scene.chapter}</span>}
                                    {scene.page && <span className="text-gray-500">{scene.page}</span>}
                                  </div>
                                  <div className="flex items-center gap-1 flex-shrink-0">
                                    <button onClick={(e) => startEditScene(scene, e)} className="p-0.5 hover:bg-gray-100 rounded" title="Bookmarkを編集">
                                      <IconPencilSmall />
                                    </button>
                                    <button onClick={() => deleteScene(work.id, scene.id)} className="p-0.5 hover:bg-gray-100 rounded" title="Bookmarkを削除">
                                      <IconTrashSmall />
                                    </button>
                                  </div>
                                </div>
                                {scene.memo && <p className="text-gray-800 my-1 whitespace-pre-wrap break-words">{scene.memo}</p>}
                                {scene.tags && scene.tags.length > 0 && (
                                  <div className="flex gap-1 flex-wrap mt-1">
                                    {scene.tags.map((t, idx) => (
                                      <span key={idx} className="text-[9px] bg-blue-50 text-blue-600 px-1 py-0.5 rounded">#{t}</span>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      {/* Bookmark追加フォーム */}
                      <form onSubmit={(e) => addScene(work.id, e)} className="bg-gray-100 p-2.5 rounded border text-xs flex flex-col gap-1.5">
                        <div className="flex gap-1">
                          <input
                            type="text"
                            placeholder="話数 (例: 12話)"
                            value={currentInput.chapter || ''}
                            onChange={e => handleSceneInputChange(work.id, 'chapter', e.target.value)}
                            className="flex-1 p-1.5 rounded border bg-white"
                          />
                          <input
                            type="text"
                            placeholder="P (例: p.5)"
                            value={currentInput.page || ''}
                            onChange={e => handleSceneInputChange(work.id, 'page', e.target.value)}
                            className="w-20 p-1.5 rounded border bg-white"
                          />
                        </div>
                        <input
                          type="text"
                          placeholder="タグ (例: 名言, 泣ける)"
                          value={currentInput.tags || ''}
                          onChange={e => handleSceneInputChange(work.id, 'tags', e.target.value)}
                          className="w-full p-1.5 rounded border bg-white"
                        />
                        <textarea
                          placeholder="名シーンのメモ..."
                          value={currentInput.memo || ''}
                          onChange={e => handleSceneInputChange(work.id, 'memo', e.target.value)}
                          className="w-full p-1.5 rounded border bg-white h-12"
                        />
                        
                        <div className="flex items-center justify-between gap-2 mt-0.5">
                          <input 
                            type="file" 
                            accept="image/*" 
                            onChange={(e) => handleSceneImageChange(work.id, e)} 
                            className="text-[10px] text-gray-500 max-w-[180px]"
                          />
                          <button type="submit" className="px-3 py-1.5 bg-blue-600 text-white font-bold rounded hover:bg-blue-700">
                            Bookmarkを追加
                          </button>
                        </div>
                      </form>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* 画像モーダル (プレビュー表示用) */}
          {previewImageUrl && (
            <div 
              className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 cursor-pointer"
              onClick={() => setPreviewImageUrl(null)}
            >
              <div className="relative max-w-full max-h-full">
                <img src={previewImageUrl} alt="拡大表示" className="max-w-full max-h-[90vh] object-contain rounded" />
                <button 
                  onClick={() => setPreviewImageUrl(null)} 
                  className="absolute -top-10 right-0 text-white font-bold text-sm bg-gray-800 px-3 py-1 rounded-full"
                >
                  閉じる ×
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
