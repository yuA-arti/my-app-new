<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推しシーンログ (修正版)</title>
    <style>
        :root {
            --primary-color: #ff6b81;
            --secondary-color: #f7d794;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2f3542;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: #74b9ff;
            margin-top: 8px;
        }

        .btn-export {
            background-color: #2ed573;
            margin-top: 8px;
        }

        .scene-item {
            border-left: 4px solid var(--primary-color);
            padding-left: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        .scene-title {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .scene-meta {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 4px;
        }

        .scene-memo {
            font-size: 0.9rem;
            white-space: pre-wrap;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff4757;
            font-size: 0.8rem;
            width: auto;
            padding: 4px 8px;
            position: absolute;
            top: 0;
            right: 0;
            cursor: pointer;
        }

        .toast {
            background: #333;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <h1>✨ 推しシーンログ ✨</h1>

    <!-- 登録フォーム -->
    <div class="card">
        <div class="form-group">
            <label for="title">作品名 / キャラクター名</label>
            <input type="text" id="title" placeholder="例: ○○アニメ 第5話 / 推しキャラ名">
        </div>
        <div class="form-group">
            <label for="scene">推しシーンの見どころ・話数・タイムコード</label>
            <input type="text" id="scene" placeholder="例: 14:20〜 の笑顔が最高">
        </div>
        <div class="form-group">
            <label for="memo">感想・メモ</label>
            <textarea id="memo" placeholder="例: ここで伏線回収されてて泣いた..."></textarea>
        </div>
        <button id="addBtn">推しシーンを追加する</button>
    </div>

    <!-- データ保存・読み込み機能 -->
    <div class="card">
        <button id="exportBtn" class="btn-export">データバックアップ（JSON保存）</button>
        <input type="file" id="importFile" style="display: none;" accept=".json">
        <button id="importBtn" class="btn-secondary">データを復元（JSON読み込み）</button>
    </div>

    <!-- リスト表示 -->
    <div class="card">
        <h2>保存したシーン一覧</h2>
        <div id="sceneList"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // DOM要素の取得
        const titleInput = document.getElementById('title');
        const sceneInput = document.getElementById('scene');
        const memoInput = document.getElementById('memo');
        const addBtn = document.getElementById('addBtn');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const importFile = document.getElementById('importFile');
        const sceneList = document.getElementById('sceneList');
        const toast = document.getElementById('toast');

        // ローカルストレージからデータ取得
        let scenes = JSON.parse(localStorage.getItem('oshi_scenes') || '[]');

        function showToast(msg) {
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function saveAndRender() {
            localStorage.setItem('oshi_scenes', JSON.stringify(scenes));
            render();
        }

        function render() {
            sceneList.innerHTML = '';
            if (scenes.length === 0) {
                sceneList.innerHTML = '<p style="color: #888; text-align: center;">まだ登録されたシーンがありません。</p>';
                return;
            }

            scenes.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'scene-item';
                div.innerHTML = `
                    <div class="scene-title">${escapeHtml(item.title)}</div>
                    <div class="scene-meta">${escapeHtml(item.scene)} (${item.date})</div>
                    <div class="scene-memo">${escapeHtml(item.memo)}</div>
                    <button class="delete-btn" onclick="deleteScene(${index})">削除</button>
                `;
                sceneList.appendChild(div);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 追加ボタンの処理（確実に動作するよう修正）
        addBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const title = titleInput.value.trim();
            const scene = sceneInput.value.trim();
            const memo = memoInput.value.trim();

            if (!title && !scene) {
                alert('「作品名」または「推しシーン」のどちらかは入力してください。');
                return;
            }

            const newItem = {
                title: title || '無題',
                scene: scene || '-',
                memo: memo || '',
                date: new Date().toLocaleDateString('ja-JP')
            };

            scenes.unshift(newItem);
            saveAndRender();

            // フォームリセット
            titleInput.value = '';
            sceneInput.value = '';
            memoInput.value = '';

            showToast('推しシーンを追加しました！');
        });

        function deleteScene(index) {
            if (confirm('このシーンを削除しますか？')) {
                scenes.splice(index, 1);
                saveAndRender();
                showToast('削除しました');
            }
        }

        // バックアップ（JSON保存）
        exportBtn.addEventListener('click', function() {
            if (scenes.length === 0) {
                alert('保存するデータがありません。');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(scenes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `oshi_scenes_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('ファイルを保存（ダウンロード）しました！');
        });

        // 復元（JSON読み込み）
        importBtn.addEventListener('click', () => importFile.click());
        importFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedScenes = JSON.parse(e.target.result);
                    if (Array.isArray(importedScenes)) {
                        scenes = importedScenes;
                        saveAndRender();
                        showToast('データを復元しました！');
                    } else {
                        alert('正しいフォーマットのファイルではありません。');
                    }
                } catch (err) {
                    alert('ファイルの読み込みに失敗しました。');
                }
            };
            reader.readAsText(file);
        });

        // 初期表示
        render();
    </script>
</body>
</html>
