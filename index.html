    const CORRECT_PASSWORD = '1234';

    const spineColors = [
      'bg-amber-800 text-amber-100 border-amber-900',
      'bg-slate-700 text-slate-100 border-slate-800',
      'bg-emerald-800 text-emerald-100 border-emerald-900',
      'bg-indigo-800 text-indigo-100 border-indigo-900',
      'bg-rose-800 text-rose-100 border-rose-900',

    ];

    const StarRatingDisplay = ({ rating }) => {
      const score = Number(rating) || 0;
      if (score <= 0) return null;
      const fullStars = '★'.repeat(score);
      const emptyStars = '☆'.repeat(Math.max(0, 5 - score));
      return (
        <div className="flex items-center gap-1 text-xs mt-0.5">
          <span className="text-yellow-400 tracking-wider font-bold">{fullStars}{emptyStars}</span>
          <span className="text-gray-500 text-[10px] font-semibold">({score.toFixed(1)})</span>
        </div>
      );
    };

    const compressImage = (file, maxWidth = 800, maxHeight = 800, quality = 0.7) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = (error) => reject(error);
        };
        reader.onerror = (error) => reject(error);
      });
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        try { return sessionStorage.getItem('manga_log_auth') === 'true'; } catch(e) { return false; }
      });
      const [passwordInput, setPasswordInput] = useState('');
      const [passError, setPassError] = useState(false);

      const [works, setWorks] = useState(() => {
        try {
          const saved = localStorage.getItem('manga_scene_works');
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });

      // マスタータグ一覧（設定で管理可能）
      const [masterTags, setMasterTags] = useState(() => {
        try {
          const saved = localStorage.getItem('manga_master_tags');
          if (saved) return JSON.parse(saved);
          return ['絵が綺麗', '主人公が魅力的', 'サバイバル', 'ファンタジー', 'アクション', 'かっこいい', '恋愛', '日常'];
        } catch(e) { return []; }
      });
      const [newMasterTagInput, setNewMasterTagInput] = useState('');

      const [viewMode, setViewMode] = useState('list');
      const [shelfGenre, setShelfGenre] = useState('');

      const [defaultSort, setDefaultSort] = useState(() => {
        try { return localStorage.getItem('manga_default_sort') || 'rating-desc'; } catch(e) { return 'rating-desc'; }
      });
      const [currentSort, setCurrentSort] = useState(() => {
        try { return localStorage.getItem('manga_default_sort') || 'rating-desc'; } catch(e) { return 'rating-desc'; }
      });
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      const [sceneSortMap, setSceneSortMap] = useState({});

      const [searchWord, setSearchWord] = useState('');
      const [selectedTag, setSelectedTag] = useState('');
      const [selectedSite, setSelectedSite] = useState('');

      const [expandedMap, setExpandedMap] = useState({});
      const [expandedTitles, setExpandedTitles] = useState({});
      const [expandedMemos, setExpandedMemos] = useState({});

      // 新規登録用フォーム状態
      const [newTitle, setNewTitle] = useState('');
      const [newAuthor, setNewAuthor] = useState('');
      const [newRating, setNewRating] = useState('5');
      const [newImage, setNewImage] = useState('');
      const [newSite, setNewSite] = useState('');
      const [newSelectedTags, setNewSelectedTags] = useState([]);
      const [newCustomTag, setNewCustomTag] = useState('');
      const [newWorkMemo, setNewWorkMemo] = useState('');

      // 作品編集モード状態
      const [editingWorkId, setEditingWorkId] = useState(null);
      const [editWorkData, setEditWorkData] = useState({});

      const [sceneInputs, setSceneInputs] = useState({});
      const [editingSceneId, setEditingSceneId] = useState(null);
      const [editSceneData, setEditSceneData] = useState({});
      const [previewImageUrl, setPreviewImageUrl] = useState(null);

      const fileInputRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('manga_scene_works', JSON.stringify(works));
        } catch(e) {
          alert('保存容量の上限を超えた可能性があります。古い画像を削除するかバックアップを取ってください。');
        }
      }, [works]);

      useEffect(() => {
        try {
          localStorage.setItem('manga_master_tags', JSON.stringify(masterTags));
        } catch(e) {}
      }, [masterTags]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === CORRECT_PASSWORD) {
          setIsAuthenticated(true);
          try { sessionStorage.setItem('manga_log_auth', 'true'); } catch(e) {}
          setPassError(false);
        } else {
          setPassError(true);
        }
      };

      const handleImageChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            setNewImage(compressed);
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }
        }
      };

      const handleEditImageChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            setEditWorkData(prev => ({ ...prev, image: compressed }));
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }
        }
      };

      const handleSceneImageChange = async (workId, e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            handleSceneInputChange(workId, 'image', compressed);
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }
        }
      };

      const handleEditSceneImageChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            setEditSceneData(prev => ({ ...prev, image: compressed }));
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }
        }
      };

      // タグのトグル処理（新規登録用）
      const toggleNewTag = (tag) => {
        if (newSelectedTags.includes(tag)) {
          setNewSelectedTags(newSelectedTags.filter(t => t !== tag));
        } else {
          setNewSelectedTags([...newSelectedTags, tag]);
        }
      };

      // タグのトグル処理（編集用）
      const toggleEditTag = (tag) => {
        const currentTags = editWorkData.tags || [];
        if (currentTags.includes(tag)) {
          setEditWorkData({ ...editWorkData, tags: currentTags.filter(t => t !== tag) });
        } else {
          setEditWorkData({ ...editWorkData, tags: [...currentTags, tag] });
        }
      };

      // 新規カスタムタグの追加（フォームから直接）
      const addCustomTagToNew = () => {
        const val = newCustomTag.trim();
        if (!val) return;
        if (!masterTags.includes(val)) {
          setMasterTags([...masterTags, val]);
        }
        if (!newSelectedTags.includes(val)) {
          setNewSelectedTags([...newSelectedTags, val]);
        }
        setNewCustomTag('');
      };

      const addCustomTagToEdit = (customVal) => {
        const val = (customVal || '').trim();
        if (!val) return;
        if (!masterTags.includes(val)) {
          setMasterTags([...masterTags, val]);
        }
        const currentTags = editWorkData.tags || [];
        if (!currentTags.includes(val)) {
          setEditWorkData({ ...editWorkData, tags: [...currentTags, val] });
        }
      };

      const addWork = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const newId = Date.now();
        const item = {
          id: newId,
          title: newTitle,
          author: newAuthor,
          rating: Number(newRating) || 5,
          image: newImage,
          site: newSite,
          tags: newSelectedTags,
          memo: newWorkMemo,
          scenes: [],
          createdAt: new Date().toISOString()
        };
        setWorks([item, ...works]);
        setExpandedMap(prev => ({ ...prev, [newId]: true }));
        setNewTitle(''); setNewAuthor(''); setNewRating('5'); setNewImage(''); setNewSite(''); setNewSelectedTags([]); setNewCustomTag(''); setNewWorkMemo('');
      };

      const startEditWork = (work, e) => {
        e.stopPropagation();
        setEditingWorkId(work.id);
        setEditWorkData({
          title: work.title || '',
          author: work.author || '',
          rating: work.rating !== undefined ? String(work.rating) : '5',
          site: work.site || '',
          image: work.image || '',
          tags: work.tags || [],
          customTagInput: '',
          memo: work.memo || ''
        });
      };

      const saveEditWork = (workId, e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!editWorkData.title.trim()) return;

        setWorks(works.map(w => {

            return {
              ...w,
              title: editWorkData.title,
              author: editWorkData.author,
              rating: Number(editWorkData.rating) || 0,
              site: editWorkData.site,
              image: editWorkData.image,
              tags: editWorkData.tags || [],
              memo: editWorkData.memo
            };
          }
          return w;
        }));
        setEditingWorkId(null);
      };

      const deleteWork = (id, e) => {
        e.stopPropagation();
        if (window.confirm('この作品と登録されたBookmarkをすべて削除しますか？')) {
          setWorks(works.filter(w => w.id !== id));
        }
      };

      const toggleExpand = (id) => {
        if (editingWorkId === id) return;
        setExpandedMap(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleTitleExpand = (id, e) => {
        e.stopPropagation();
        setExpandedTitles(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleMemoExpand = (id, e) => {
        e.stopPropagation();
        setExpandedMemos(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const addScene = (workId, e) => {
        if (e) e.preventDefault();
        const input = sceneInputs[workId] || {};
        if (!input.memo?.trim() && !input.image && !input.chapter) return;

        const newScene = {
          id: Date.now(),
          chapter: input.chapter || '',
          page: input.page || '',
          memo: input.memo || '',
          image: input.image || '',
          tags: input.tags ? input.tags.split(',').map(t => t.trim()).filter(Boolean) : [],
          createdAt: new Date().toISOString()
        };

        setWorks(works.map(w => {
          if (w.id === workId) {
            return { ...w, scenes: [...(w.scenes || []), newScene] };
          }
          return w;
        }));

        setSceneInputs({ ...sceneInputs, [workId]: { chapter: '', page: '', memo: '', image: '', tags: '' } });
      };

      const startEditScene = (scene, e) => {
        e.stopPropagation();
        setEditingSceneId(scene.id);
        setEditSceneData({
          chapter: scene.chapter || '',
          page: scene.page || '',
          memo: scene.memo || '',
          image: scene.image || '',
          tags: (scene.tags || []).join(', ')
        });
      };

      const saveEditScene = (workId, sceneId, e) => {
        e.preventDefault();
        e.stopPropagation();

        setWorks(works.map(w => {
          if (w.id === workId) {
            return {
              ...w,
              scenes: (w.scenes || []).map(s => {
                if (s.id === sceneId) {
                  return {
                    ...s,
                    chapter: editSceneData.chapter,
                    page: editSceneData.page,
                    memo: editSceneData.memo,
                    image: editSceneData.image,
                    tags: editSceneData.tags ? editSceneData.tags.split(',').map(t => t.trim()).filter(Boolean) : []
                  };
                }
                return s;
              })
            };
          }
          return w;
        }));
        setEditingSceneId(null);
      };

      const deleteScene = (workId, sceneId, e) => {
        if (e) e.stopPropagation();
        if (window.confirm('このBookmarkを削除しますか？')) {
          setWorks(works.map(w => {
            if (w.id === workId) {
              return { ...w, scenes: (w.scenes || []).filter(s => s.id !== sceneId) };
            }
            return w;
          }));
        }
      };

      const handleSceneInputChange = (workId, field, value) => {
        setSceneInputs(prev => ({
          ...prev,
          [workId]: { ...(prev[workId] || {}), [field]: value }
        }));
      };

      const exportBackup = async () => {
        const jsonString = JSON.stringify(works, null, 2);
        const fileName = `favorite_scenes_backup_${new Date().toISOString().slice(0, 10)}.json`;
        const blob = new Blob([jsonString], { type: 'application/json' });
        const file = new File([blob], fileName, { type: 'application/json' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Favorite Scenes バックアップ',
              text: 'Favorite Scenesのバックアップデータです。'
            });
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", URL.createObjectURL(blob));
        downloadAnchor.setAttribute("download", fileName);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importBackup = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (Array.isArray(parsed) && window.confirm('現在のデータを上書きして復元しますか？')) {
                setWorks(parsed);
                // 復元したデータに含まれるタグもマスタータグに統合
                const restoredTags = Array.from(new Set(parsed.flatMap(w => w.tags || []).filter(Boolean)));
                setMasterTags(prev => Array.from(new Set([...prev, ...restoredTags])));
                alert('データを復元しました！');
              }
            } catch(err) {
              alert('ファイルの読み込みに失敗しました。正しいバックアップファイルを選択してください。');
            }
          };
        }
      };

      const saveDefaultSettings = (newDefSort) => {
        setDefaultSort(newDefSort);
        setCurrentSort(newDefSort);
        try {
          localStorage.setItem('manga_default_sort', newDefSort);
        } catch(e) {}
        setIsSettingsOpen(false);
      };

      // タグ管理用関数
      const handleAddMasterTag = () => {
        const val = newMasterTagInput.trim();
        if (!val) return;
        if (!masterTags.includes(val)) {
          setMasterTags([...masterTags, val]);
        }
        setNewMasterTagInput('');
      };

      const handleDeleteMasterTag = (tagToDelete) => {
        setMasterTags(masterTags.filter(t => t !== tagToDelete));
      };

      const allSites = Array.from(new Set(works.map(w => w.site).filter(Boolean)));
      const allTags = Array.from(new Set([
        ...masterTags,
        ...works.flatMap(w => w.tags || [])
      ]));

      // 検索・フィルタリング処理（※検索時も自動展開しないようisOpenを完全分離）
      const filteredWorks = works.filter(w => {
        const matchWord = searchWord === '' || 
          (w.title && w.title.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.author && w.author.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.memo && w.memo.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.scenes && w.scenes.some(s => s.memo && s.memo.toLowerCase().includes(searchWord.toLowerCase())));

        const matchSite = selectedSite === '' || w.site === selectedSite;

        const matchTag = selectedTag === '' || 
          (w.tags && w.tags.includes(selectedTag)) ||
          (w.scenes && w.scenes.some(s => s.tags && s.tags.includes(selectedTag)));

        return matchWord && matchSite && matchTag;
      }).sort((a, b) => {
        const rA = a.rating !== undefined ? Number(a.rating) : 0;
        const rB = b.rating !== undefined ? Number(b.rating) : 0;
        const idA = Number(a.id) || 0;
        const idB = Number(b.id) || 0;

        if (currentSort === 'rating-desc') {
          if (rB !== rA) return rB - rA;
          return idB - idA;
        }
        if (currentSort === 'rating-asc') {
          if (rA !== rB) return rA - rB;

                                      type="text"
                                      placeholder="話数"
                                      value={editSceneData.chapter}
                                      onChange={e => setEditSceneData({...editSceneData, chapter: e.target.value})}
                                      className="flex-1 p-1.5 rounded border text-xs"
                                    />
                                    <input
                                      type="text"
                                      placeholder="ページ"
                                      value={editSceneData.page}
                                      onChange={e => setEditSceneData({...editSceneData, page: e.target.value})}
                                      className="w-20 p-1.5 rounded border text-xs"
                                    />
                                  </div>
                                  <input
                                    type="text"
                                    placeholder="タグ"
                                    value={editSceneData.tags}
                                    onChange={e => setEditSceneData({...editSceneData, tags: e.target.value})}
                                    className="w-full p-1.5 rounded border text-xs"
                                  />
                                  <textarea
                                    placeholder="名シーンのメモ"
                                    value={editSceneData.memo}
                                    onChange={e => setEditSceneData({...editSceneData, memo: e.target.value})}
                                    className="w-full p-1.5 rounded border text-xs h-14"
                                  />
                                  
                                  <div className="flex flex-col gap-1">
                                    <label className="font-bold text-gray-600">画像を変更:</label>
                                    <input 
                                      type="file" 
                                      accept="image/*" 
                                      onChange={handleEditSceneImageChange} 
                                      className="p-1 border rounded text-xs bg-white"
                                    />
                                    {editSceneData.image && (
                                      <div className="flex items-center gap-2 mt-1">
                                        <img src={editSceneData.image} alt="プレビュー" className="w-12 h-12 object-cover rounded border" />
                                        <button type="button" onClick={() => setEditSceneData({...editSceneData, image: ''})} className="text-red-500 text-xs underline">画像を削除</button>
                                      </div>
                                    )}
                                  </div>

                                  <div className="flex justify-end gap-2 mt-1">
                                    <button type="button" onClick={() => setEditingSceneId(null)} className="px-2.5 py-1 bg-gray-300 text-gray-700 rounded">キャンセル</button>
                                    <button type="submit" className="px-2.5 py-1 bg-blue-600 text-white rounded font-bold">更新</button>
                                  </div>
                                </form>
                              ) : (
                                <div key={scene.id} className="bg-white p-2.5 rounded border shadow-sm text-xs flex gap-2.5 items-start">
                                  {scene.image && (
                                    <img 
                                      src={scene.image} 
                                      alt="Scene" 
                                      onClick={() => setPreviewImageUrl(scene.image)}
                                      className="w-14 h-14 object-cover rounded border flex-shrink-0 cursor-zoom-in hover:opacity-80 transition-opacity"
                                    />
                                  )}
                                  <div className="flex-1 min-w-0">
                                    <div className="flex justify-between items-start">
                                      <div className="font-bold text-blue-800 flex items-center gap-1.5">
                                        {scene.chapter && <span>{scene.chapter}話</span>}
                                        {scene.page && <span className="text-gray-500 font-normal">({scene.page}p)</span>}
                                      </div>
                                      <div className="flex items-center gap-1">
                                        <button onClick={(e) => startEditScene(scene, e)} className="p-0.5 hover:bg-gray-100 rounded" title="編集">
                                          <IconPencilSmall />
                                        </button>
                                        <button onClick={() => deleteScene(work.id, scene.id, e)} className="p-0.5 hover:bg-gray-100 rounded" title="削除">
                                          <IconTrashSmall />
                                        </button>
                                      </div>
                                    </div>
                                    {scene.memo && <p className="text-gray-700 mt-1 whitespace-pre-wrap break-words">{scene.memo}</p>}
                                    {scene.tags && scene.tags.length > 0 && (
                                      <div className="flex gap-1 flex-wrap mt-1">
                                        {scene.tags.map((t, idx) => (
                                          <span key={idx} className="text-[9px] bg-blue-50 text-blue-600 px-1 py-0.5 rounded">#{t}</span>
                                        ))}
                                      </div>
                                    )}
                                  </div>
                                </div>
                              );
                            })}
                          </div>

                          {/* 新規Bookmark追加フォーム */}
                          <form onSubmit={(e) => addScene(work.id, e)} className="bg-white p-2.5 rounded border flex flex-col gap-2 text-xs">
                            <div className="font-bold text-gray-700 text-[11px]">＋ 新しいBookmarkを追加</div>
                            <div className="flex gap-1.5">
                              <input
                                type="text"
                                placeholder="話数 (例: 12)"
                                value={currentInput.chapter || ''}
                                onChange={e => handleSceneInputChange(work.id, 'chapter', e.target.value)}
                                className="flex-1 p-1.5 rounded border text-xs"
                              />
                              <input
                                type="text"
                                placeholder="ページ (例: 5)"
                                value={currentInput.page || ''}
                                onChange={e => handleSceneInputChange(work.id, 'page', e.target.value)}
                                className="w-20 p-1.5 rounded border text-xs"
                              />
                            </div>
                            <input
                              type="text"
                              placeholder="タグ (カンマ区切り)"
                              value={currentInput.tags || ''}
                              onChange={e => handleSceneInputChange(work.id, 'tags', e.target.value)}
                              className="w-full p-1.5 rounded border text-xs"
                            />
                            <textarea
                              placeholder="名シーンのメモやセリフ"
                              value={currentInput.memo || ''}
                              onChange={e => handleSceneInputChange(work.id, 'memo', e.target.value)}
                              className="w-full p-1.5 rounded border text-xs h-12"
                            />
                            
                            <div className="flex items-center justify-between gap-2">
                              <input 
                                type="file" 
                                accept="image/*" 
                                onChange={(e) => handleSceneImageChange(work.id, e)} 
                                className="p-0.5 border rounded text-[10px] bg-white flex-1 min-w-0"
                              />
                              <button type="submit" className="px-3 py-1.5 bg-blue-600 text-white rounded font-bold text-xs flex-shrink-0 hover:bg-blue-700">
                                追加
                              </button>
                            </div>
                            {currentInput.image && (
                              <div className="flex items-center gap-2">
                                <img src={currentInput.image} alt="プレビュー" className="w-8 h-8 object-cover rounded border" />
                                <button type="button" onClick={() => handleSceneInputChange(work.id, 'image', '')} className="text-red-500 text-[10px] underline">削除</button>
                              </div>
                            )}
                          </form>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          )}

          {/* 設定モーダル */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl max-w-sm w-full p-4 shadow-xl flex flex-col gap-3.5 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800 text-sm flex items-center gap-1.5">
                    <IconGear /> アプリ設定
                  </h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-gray-400 hover:text-gray-600 font-bold">×</button>
                </div>

                {/* デフォルト並び順設定 */}
                <div className="flex flex-col gap-1 text-xs">
                  <label className="font-bold text-gray-700">デフォルトの並び順:</label>
                  <p className="text-gray-500 text-[11px]">ページを開いた時に最初に適用される並び順です。</p>
                  <select 
                    id="settings-default-sort" 
                    defaultValue={defaultSort} 
                    className="p-2 border rounded text-xs bg-white mt-1"
                  >
                    <option value="rating-desc">★ 高評価順</option>
                    <option value="rating-asc">★ 低評価順</option>
                    <option value="date-desc">登録が最近の順</option>
                    <option value="date-asc">登録が古い順</option>
                  </select>
                </div>

                {/* タグ管理設定 */}
                <div className="flex flex-col gap-1.5 text-xs border-t pt-3">
                  <label className="font-bold text-gray-700">タグの管理 (選択候補):</label>
                  <p className="text-gray-500 text-[11px]">作品登録時に選択できるタグを追加・削除できます。</p>
                  
                  <div className="flex gap-1.5 mt-1">
                    <input 
                      type="text" 
                      placeholder="新しいタグ名..." 
                      value={newMasterTagInput}
                      onChange={e => setNewMasterTagInput(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); handleAddMasterTag(); } }}
                      className="flex-1 p-1.5 border rounded text-xs bg-white"
                    />
                    <button 
                      type="button" 
                      onClick={handleAddMasterTag} 
                      className="px-3 py-1.5 bg-blue-600 text-white rounded font-bold text-xs"
                    >
                      追加
                    </button>
                  </div>

                  <div className="flex flex-wrap gap-1 max-h-32 overflow-y-auto p-1.5 border rounded bg-gray-50 mt-1">
                    {masterTags.map(tag => (
                      <span key={tag} className="inline-flex items-center gap-1 bg-white border border-gray-300 px-2 py-0.5 rounded text-[11px] text-gray-700">
                        #{tag}
                        <button 
                          type="button" 
                          onClick={() => handleDeleteMasterTag(tag)} 
                          className="text-gray-400 hover:text-red-500 font-bold ml-0.5"
                          title="削除"
                        >
                          ×
                        </button>
                      </span>
                    ))}
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t mt-1">
                  <button onClick={() => setIsSettingsOpen(false)} className="px-3 py-1.5 bg-gray-200 text-gray-700 text-xs rounded font-bold">
                    キャンセル
                  </button>
                  <button 
                    onClick={() => {
                      const val = document.getElementById('settings-default-sort').value;
                      saveDefaultSettings(val);
                    }} 
                    className="px-3 py-1.5 bg-blue-600 text-white text-xs rounded font-bold hover:bg-blue-700"
                  >
                    設定を保存
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 画像拡大表示モーダル */}
          {previewImageUrl && (
            <div 
              className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 cursor-pointer"
              onClick={() => setPreviewImageUrl(null)}
            >
              <div className="relative max-w-full max-h-full">
                <img src={previewImageUrl} alt="拡大表示" className="max-w-full max-h-[90vh] object-contain rounded" />
                <p className="text-white text-center text-xs mt-2">タップで閉じる</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
