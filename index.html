    const { useState, useEffect, useRef } = React;

    // --- IndexedDB ラッパーユーティリティ ---
    const DB_NAME = 'FavoriteScenesDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'app_data';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const idbGet = async (key) => {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([STORE_NAME], 'readonly');
          const store = transaction.objectStore(STORE_NAME);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        return null;
      }
    };

    const idbSet = async (key, val) => {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([STORE_NAME], 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const req = store.put(val, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        console.error('IndexedDB Save Error:', e);
      }
    };

    const StarRatingDisplay = ({ rating }) => {
      const score = Number(rating) || 0;
      if (score <= 0) return null;
      const fullStars = '★'.repeat(score);
      const emptyStars = '☆'.repeat(Math.max(0, 5 - score));
      return (
        <div className="flex items-center gap-1 text-xs mt-0.5">
          <span className="text-yellow-400 tracking-wider font-bold">{fullStars}{emptyStars}</span>
          <span className="text-gray-500 text-[10px] font-semibold">({score.toFixed(1)})</span>
        </div>
      );
    };

    // 最適化された画像圧縮（長辺600px、画質0.65でクリアかつ容量をセーブ）
    const compressImage = (file, maxWidth = 600, maxHeight = 600, quality = 0.65) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = (error) => reject(error);
        };
        reader.onerror = (error) => reject(error);
      });
    };

    function App() {

      ]);

      ]);

      const [viewMode, setViewMode] = useState('list');
      const [shelfGenreFilter, setShelfGenreFilter] = useState('');
      const [selectedWorkId, setSelectedWorkId] = useState(null);

      const [defaultSort, setDefaultSort] = useState('rating-desc');
      const [currentSort, setCurrentSort] = useState('rating-desc');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      // 非表示管理用状態
      const [isSecretUnlocked, setIsSecretUnlocked] = useState(false);
      const [secretPasswordInput, setSecretPasswordInput] = useState('');
      const [secretPassError, setSecretPassError] = useState(false);
      const [secretTab, setSecretTab] = useState('works');

      const [sceneSortMap, setSceneSortMap] = useState({});

      const [searchWord, setSearchWord] = useState('');

      const [selectedTag, setSelectedTag] = useState('');
      const [selectedSite, setSelectedSite] = useState('');

      const [expandedTitles, setExpandedTitles] = useState({});
      const [expandedMemos, setExpandedMemos] = useState({});

      // 新規登録フォーム用
      const [newTitle, setNewTitle] = useState('');
      const [newAuthor, setNewAuthor] = useState('');
      const [newGenre, setNewGenre] = useState('');
      const [newRating, setNewRating] = useState('5');
      const [newImage, setNewImage] = useState('');
      const [newSite, setNewSite] = useState('');
      const [newSelectedTags, setNewSelectedTags] = useState([]);
      const [newCustomTag, setNewCustomTag] = useState('');
      const [newWorkMemo, setNewWorkMemo] = useState('');

      // 編集用
      const [editingWorkId, setEditingWorkId] = useState(null);
      const [editWorkData, setEditWorkData] = useState({});

      const [sceneInputs, setSceneInputs] = useState({});
      const [sceneCustomTagMap, setSceneCustomTagMap] = useState({});
      const [editingSceneId, setEditingSceneId] = useState(null);
      const [editSceneData, setEditSceneData] = useState({});
      const [editSceneCustomTag, setEditSceneCustomTag] = useState('');
      const [previewImageUrl, setPreviewImageUrl] = useState(null);

      const fileInputRef = useRef(null);

      // --- IndexedDB 初期読み込み ＆ localStorage からの自動移行 ---
      useEffect(() => {
        const loadInitialData = async () => {
          try {
            let loadedWorks = await idbGet('manga_scene_works');
            // IndexedDB にまだない場合、localStorage から移行
            if (!loadedWorks) {
              const localSaved = localStorage.getItem('manga_scene_works');
              if (localSaved) {
                try {
                  loadedWorks = JSON.parse(localSaved);
                  await idbSet('manga_scene_works', loadedWorks);
                } catch(e) {}
              }
            }
            if (loadedWorks && Array.isArray(loadedWorks)) {
              setWorks(loadedWorks);
            }

            let loadedGenres = await idbGet('manga_master_genres');
            if (!loadedGenres) {
              const localSaved = localStorage.getItem('manga_master_genres');
              if (localSaved) {
                try {
                  loadedGenres = JSON.parse(localSaved);
                  await idbSet('manga_master_genres', loadedGenres);
                } catch(e) {}
              }
            }
            if (loadedGenres && Array.isArray(loadedGenres)) {
              setMasterGenres(loadedGenres);
            }

            let loadedTags = await idbGet('manga_master_tags');
            if (!loadedTags) {
              const localSaved = localStorage.getItem('manga_master_tags');
              if (localSaved) {
                try {
                  loadedTags = JSON.parse(localSaved);
                  await idbSet('manga_master_tags', loadedTags);
                } catch(e) {}
              }
            }
            if (loadedTags && Array.isArray(loadedTags)) {
              setMasterTags(loadedTags);
            }

            let loadedSort = await idbGet('manga_default_sort');
            if (!loadedSort) {
              loadedSort = localStorage.getItem('manga_default_sort') || 'rating-desc';
            }
            setDefaultSort(loadedSort);
            setCurrentSort(loadedSort);

          } catch (err) {
            console.error('Data load error:', err);
          } finally {
            setIsDataLoaded(true);
          }
        };

        loadInitialData();
      }, []);

      // データ保存（IndexedDBへ自動非同期保存）
      useEffect(() => {
        if (!isDataLoaded) return;
        idbSet('manga_scene_works', works);
      }, [works, isDataLoaded]);

      useEffect(() => {
        if (!isDataLoaded) return;
        idbSet('manga_master_genres', masterGenres);
      }, [masterGenres, isDataLoaded]);

      useEffect(() => {
        if (!isDataLoaded) return;
        idbSet('manga_master_tags', masterTags);
      }, [masterTags, isDataLoaded]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === CORRECT_PASSWORD) {
          setIsAuthenticated(true);
          try { sessionStorage.setItem('manga_log_auth', 'true'); } catch(e) {}
          setPassError(false);
        } else {
          setPassError(true);
        }
      };

      const handleImageChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            setNewImage(compressed);
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }
        }
      };

      const handleEditImageChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            setEditWorkData(prev => ({ ...prev, image: compressed }));
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }

      };

      const handleSceneImageChange = async (workId, e) => {

            alert('画像の読み込み・圧縮に失敗しました');
          }
        }
      };

      const handleEditSceneImageChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const compressed = await compressImage(file);
            setEditSceneData(prev => ({ ...prev, image: compressed }));
          } catch (err) {
            alert('画像の読み込み・圧縮に失敗しました');
          }

      };

      const toggleTagInList = (currentList, tag) => {
        if (currentList.includes(tag)) {
          return currentList.filter(t => t !== tag);
        } else {
          return [...currentList, tag];
        }
      };

      const toggleNewTag = (tag) => {
        setNewSelectedTags(prev => toggleTagInList(prev, tag));
      };

      const toggleEditTag = (tag) => {
        const currentTags = editWorkData.tags || [];
        setEditWorkData({ ...editWorkData, tags: toggleTagInList(currentTags, tag) });
      };

      const toggleSceneTag = (workId, tag) => {
        const currentInput = sceneInputs[workId] || {};
        const currentTags = currentInput.tags || [];

        setSceneInputs(prev => ({
          ...prev,
          [workId]: { ...(prev[workId] || {}), tags: nextTags }
        }));
      };

      const addSceneCustomTag = (workId) => {
        const val = (sceneCustomTagMap[workId] || '').trim();
        if (!val) return;
        if (!masterTags.includes(val)) {
          setMasterTags(prev => [...prev, val]);
        }
        const currentInput = sceneInputs[workId] || {};
        const currentTags = currentInput.tags || [];
        if (!currentTags.includes(val)) {
          setSceneInputs(prev => ({
            ...prev,
            [workId]: { ...(prev[workId] || {}), tags: [...currentTags, val] }
          }));
        }
        setSceneCustomTagMap(prev => ({ ...prev, [workId]: '' }));
      };

      const toggleEditSceneTag = (tag) => {
        const currentTags = editSceneData.tags || [];
        setEditSceneData({ ...editSceneData, tags: toggleTagInList(currentTags, tag) });
      };

      const addEditSceneCustomTag = () => {
        const val = editSceneCustomTag.trim();
        if (!val) return;
        if (!masterTags.includes(val)) {
          setMasterTags(prev => [...prev, val]);
        }
        const currentTags = editSceneData.tags || [];
        if (!currentTags.includes(val)) {
          setEditSceneData({ ...editSceneData, tags: [...currentTags, val] });
        }
        setEditSceneCustomTag('');
      };

      const addCustomTagToNew = () => {
        const val = newCustomTag.trim();
        if (!val) return;
        if (!masterTags.includes(val)) {
          setMasterTags([...masterTags, val]);
        }
        if (!newSelectedTags.includes(val)) {
          setNewSelectedTags([...newSelectedTags, val]);
        }
        setNewCustomTag('');

        }

          title: newTitle,

          scenes: [],

          title: work.title || '',
          author: work.author || '',
          genre: work.genre || '',

          site: work.site || '',
          image: work.image || '',
          tags: work.tags || [],
          customTagInput: '',
          memo: work.memo || ''

        e.preventDefault();
        e.stopPropagation();
        if (!editWorkData.title.trim()) return;

        setWorks(works.map(w => {
          if (w.id === workId) {
            return {
              ...w,
              title: editWorkData.title,
              author: editWorkData.author,
              genre: editWorkData.genre,
              rating: Number(editWorkData.rating) || 0,
              site: editWorkData.site,
              image: editWorkData.image,
              tags: editWorkData.tags || [],
              memo: editWorkData.memo

              ...w,
              scenes: (w.scenes || []).map(s => {
                if (s.id === sceneId) {
                  const nextState = !s.isHidden;
                  alert(nextState ? 'このBookmarkを非表示にしました。' : 'このBookmarkを再表示しました。');
                  return { ...s, isHidden: nextState };
                }
                return s;
              })
            };
          }
          return w;
        }));
      };

      const toggleExpand = (id) => {
        if (editingWorkId === id) return;
        setExpandedMap(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleTitleExpand = (id, e) => {
        e.stopPropagation();
        setExpandedTitles(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleMemoExpand = (id, e) => {
        e.stopPropagation();
        setExpandedMemos(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const addScene = (workId, e) => {
        if (e) e.preventDefault();
        const input = sceneInputs[workId] || {};
        if (!input.memo?.trim() && !input.image && !input.chapter) return;

        const newScene = {
          id: Date.now(),
          chapter: input.chapter || '',
          page: input.page || '',
          memo: input.memo || '',
          image: input.image || '',
          tags: Array.isArray(input.tags) ? input.tags : (input.tags ? String(input.tags).split(',').map(t => t.trim()).filter(Boolean) : []),
          isHidden: false,
          createdAt: new Date().toISOString()
        };

        setWorks(works.map(w => {
          if (w.id === workId) {
            return { ...w, scenes: [...(w.scenes || []), newScene] };
          }
          return w;
        }));

        setSceneInputs({ ...sceneInputs, [workId]: { chapter: '', page: '', memo: '', image: '', tags: [] } });
      };

      const startEditScene = (scene, e) => {
        e.stopPropagation();
        setEditingSceneId(scene.id);
        setEditSceneData({
          chapter: scene.chapter || '',
          page: scene.page || '',
          memo: scene.memo || '',
          image: scene.image || '',
          tags: scene.tags || []
        });
        setEditSceneCustomTag('');
      };

      const saveEditScene = (workId, sceneId, e) => {
        e.preventDefault();
        e.stopPropagation();

        setWorks(works.map(w => {
          if (w.id === workId) {
            return {
              ...w,
              scenes: (w.scenes || []).map(s => {
                if (s.id === sceneId) {
                  return {
                    ...s,
                    chapter: editSceneData.chapter,
                    page: editSceneData.page,
                    memo: editSceneData.memo,
                    image: editSceneData.image,
                    tags: editSceneData.tags || []
                  };
                }
                return s;
              })
            };
          }
          return w;
        }));
        setEditingSceneId(null);
      };

      const deleteScene = (workId, sceneId, e) => {
        if (e) e.stopPropagation();
        if (window.confirm('このBookmarkを削除しますか？')) {
          setWorks(works.map(w => {
            if (w.id === workId) {
              return { ...w, scenes: (w.scenes || []).filter(s => s.id !== sceneId) };
            }
            return w;
          }));
        }
      };

      const handleSceneInputChange = (workId, field, value) => {
        setSceneInputs(prev => ({
          ...prev,
          [workId]: { ...(prev[workId] || {}), [field]: value }
        }));
      };

      const exportBackup = async () => {
        const jsonString = JSON.stringify(works, null, 2);
        const fileName = `favorite_scenes_backup_${new Date().toISOString().slice(0, 10)}.json`;
        const blob = new Blob([jsonString], { type: 'application/json' });
        const file = new File([blob], fileName, { type: 'application/json' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Favorite Scenes バックアップ',
              text: 'Favorite Scenesのバックアップデータです。'
            });
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", URL.createObjectURL(blob));
        downloadAnchor.setAttribute("download", fileName);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importBackup = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (Array.isArray(parsed) && window.confirm('現在のデータを上書きして復元しますか？')) {
                setWorks(parsed);
                const restoredTags = Array.from(new Set(parsed.flatMap(w => [
                  ...(w.tags || []),
                  ...(w.scenes || []).flatMap(s => s.tags || [])
                ]).filter(Boolean)));
                setMasterTags(prev => Array.from(new Set([...prev, ...restoredTags])));
                
                const restoredGenres = Array.from(new Set(parsed.map(w => w.genre).filter(Boolean)));
                setMasterGenres(prev => Array.from(new Set([...prev, ...restoredGenres])));

                alert('データを復元しました！');
              }
            } catch(err) {
              alert('ファイルの読み込みに失敗しました。正しいバックアップファイルを選択してください。');
            }
          };
        }
      };

      const saveDefaultSettings = (newDefSort) => {
        setDefaultSort(newDefSort);
        setCurrentSort(newDefSort);
        idbSet('manga_default_sort', newDefSort);
        setIsSettingsOpen(false);
      };

      const handleAddMasterTag = () => {
        const val = newMasterTagInput.trim();
        if (!val) return;
        if (!masterTags.includes(val)) {
          setMasterTags([...masterTags, val]);
        }
        setNewMasterTagInput('');
      };

      const handleDeleteMasterTag = (tagToDelete) => {
        setMasterTags(masterTags.filter(t => t !== tagToDelete));
      };

      const handleAddMasterGenre = () => {
        const val = newMasterGenreInput.trim();
        if (!val) return;
        if (!masterGenres.includes(val)) {
          setMasterGenres([...masterGenres, val]);
        }
        setNewMasterGenreInput('');
      };

      const handleDeleteMasterGenre = (genreToDelete) => {
        setMasterGenres(masterGenres.filter(g => g !== genreToDelete));
      };

      const handleUnlockSecret = (e) => {
        e.preventDefault();
        if (secretPasswordInput === CORRECT_PASSWORD) {
          setIsSecretUnlocked(true);
          setSecretPassError(false);
          setSecretPasswordInput('');
        } else {
          setSecretPassError(true);
        }
      };

      const visibleWorks = works.filter(w => !w.isHidden);

      const allSites = Array.from(new Set(visibleWorks.map(w => w.site).filter(Boolean)));
      const allGenres = Array.from(new Set([...masterGenres, ...visibleWorks.map(w => w.genre).filter(Boolean)]));
      const allTags = Array.from(new Set([
        ...masterTags,
        ...visibleWorks.flatMap(w => [
          ...(w.tags || []),
          ...(w.scenes || []).filter(s => !s.isHidden).flatMap(s => s.tags || [])
        ])
      ]));

      const filteredWorks = visibleWorks.filter(w => {
        if (selectedWorkId !== null) {
          return w.id === selectedWorkId;
        }

        const matchWord = searchWord === '' || 
          (w.title && w.title.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.author && w.author.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.memo && w.memo.toLowerCase().includes(searchWord.toLowerCase())) ||
          (w.scenes && w.scenes.some(s => !s.isHidden && s.memo && s.memo.toLowerCase().includes(searchWord.toLowerCase())));

        const matchGenre = selectedGenre === '' || w.genre === selectedGenre;
        const matchSite = selectedSite === '' || w.site === selectedSite;

        const matchTag = selectedTag === '' || 
          (w.tags && w.tags.includes(selectedTag)) ||
          (w.scenes && w.scenes.some(s => !s.isHidden && s.tags && s.tags.includes(selectedTag)));

        return matchWord && matchGenre && matchSite && matchTag;
      }).sort((a, b) => {
        const rA = a.rating !== undefined ? Number(a.rating) : 0;
        const rB = b.rating !== undefined ? Number(b.rating) : 0;
        const idA = Number(a.id) || 0;
        const idB = Number(b.id) || 0;

        if (currentSort === 'rating-desc') {
          if (rB !== rA) return rB - rA;
          return idB - idA;
        }
        if (currentSort === 'rating-asc') {
          if (rA !== rB) return rA - rB;
          return idB - idA;
        }
        if (currentSort === 'date-desc') return idB - idA;
        if (currentSort === 'date-asc') return idA - idB;
        return 0;
      });

      const shelfGenreGroups = () => {
        const targetGenres = shelfGenreFilter 
          ? [shelfGenreFilter] 
          : [...allGenres, '未分類'];

        return targetGenres.map(genre => {
          const list = visibleWorks.filter(w => {
            if (genre === '未分類') {
              return !w.genre || w.genre === '';
            }
            return w.genre === genre;
          });
          return { genre, works: list };
        }).filter(group => group.works.length > 0 || shelfGenreFilter !== '');
      };

      const openWorkFromShelf = (workId) => {
        setSelectedWorkId(workId);
        setViewMode('list');
        setExpandedMap(prev => ({ ...prev, [workId]: true }));
      };

      if (!isAuthenticated) {
        return (
          <div className="flex justify-center items-center min-h-screen bg-gray-100 p-4">
            <form onSubmit={handleLogin} className="bg-white p-6 rounded-xl shadow-md text-center w-80">
              <IconLock />
              <h2 className="text-xl font-bold mb-1">Favorite Scenes</h2>
              <p className="text-xs text-gray-500 mb-4">（名シーン記録帳）</p>
              <input
                type="password"
                placeholder="パスワードを入力"
                value={passwordInput}
                onChange={(e) => setPasswordInput(e.target.value)}
                className="w-full p-2 rounded border mb-2 text-base focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              {passError && <p className="text-red-500 text-xs mb-2">パスワードが違います</p>}
              <button type="submit" className="w-full p-2.5 bg-blue-600 text-white rounded font-bold text-sm hover:bg-blue-700">
                解除する
              </button>
            </form>
          </div>
        );

      return (
        <div className="max-w-2xl mx-auto p-3 text-gray-800 min-h-screen pb-12">
          
          {/* ヘッダー */}
          <div className="flex flex-wrap items-center justify-between gap-y-2 gap-x-3 mb-3">
            <div className="flex items-baseline gap-1.5 min-w-0">
              <h1 className="flex items-center gap-1.5 text-lg font-bold text-gray-900 truncate">
                <IconBook /> Favorite Scenes

              <span className="text-xs text-gray-500 font-normal whitespace-nowrap">（名シーン記録帳）</span>
            </div>
            
            <div className="flex items-center gap-1.5 text-[10px] ml-auto">
              <button 
                onClick={() => {
                  if (viewMode === 'shelf') {
                    setViewMode('list');
                  } else {
                    setSelectedWorkId(null);
                    setViewMode('shelf');
                  }

                className={`px-2.5 py-1.5 rounded font-bold whitespace-nowrap flex items-center transition-colors ${
                  viewMode === 'shelf' ? 'bg-indigo-900 text-white hover:bg-indigo-950' : 'bg-gray-200 text-gray-800 hover:bg-gray-300'
                }`}
              >
                <IconShelf /> {viewMode === 'shelf' ? '一覧で見る' : '本棚で見る'}
              </button>

              <button onClick={exportBackup} className="bg-gray-200 hover:bg-gray-300 px-2 py-1.5 rounded text-gray-700 font-bold whitespace-nowrap">
                保存(書き出し)
              </button>
              <button onClick={() => fileInputRef.current?.click()} className="bg-gray-200 hover:bg-gray-300 px-2 py-1.5 rounded text-gray-700 font-bold whitespace-nowrap">
                復元(読み込み)
              </button>
              <button onClick={() => { setIsSettingsOpen(true); setIsSecretUnlocked(false); }} title="設定" className="bg-gray-200 hover:bg-gray-300 p-1.5 rounded text-gray-700 flex items-center justify-center">
                <IconGear />
              </button>
              <input type="file" ref={fileInputRef} onChange={importBackup} accept=".json" className="hidden" />
            </div>
          </div>

          {/* 本棚表示モード */}
          {viewMode === 'shelf' ? (
            <div className="bg-white rounded-xl p-3 shadow-sm border-2 border-slate-800">
              <div className="flex items-center justify-between mb-4 border-b pb-2">
                <div className="text-xs font-bold text-slate-900 flex items-center gap-1.5">
                  <span className="text-sm">📚</span>
                  <span>マイ本棚</span>
                  <span className="text-[10px] bg-sky-100 text-sky-800 border border-sky-300 px-2 py-0.5 rounded-full font-bold">
                    {visibleWorks.length}冊
                  </span>
                </div>
                <select 
                  value={shelfGenreFilter} 
                  onChange={e => setShelfGenreFilter(e.target.value)} 
                  className="p-1 text-xs rounded border border-gray-300 bg-white"
                >
                  <option value="">すべてのジャンル棚を表示</option>
                  {allGenres.map(g => (
                    <option key={g} value={g}>{g}</option>
                  ))}
                </select>
              </div>

              {/* ジャンルごとの棚 */}
              <div className="flex flex-col gap-6">
                {shelfGenreGroups().length === 0 ? (
                  <div className="bg-slate-50 p-8 rounded-lg text-center text-xs text-slate-500 border border-slate-200">
                    本棚に表示できる作品がありません
                  </div>
                ) : (
                  shelfGenreGroups().map(group => (
                    <div key={group.genre} className="relative bg-white pt-5 pb-0 px-2 rounded-lg border-2 border-slate-800 shadow-sm">
                      
                      {/* インデックス・見出しリボン風 */}
                      <div className="absolute -top-3 left-3 flex items-center shadow-md">
                        <div className="bg-slate-900 text-white text-[11px] font-bold px-3 py-1 rounded-t-sm flex items-center gap-1.5 border-t border-l border-r border-slate-700">
                          <span className="w-1.5 h-1.5 rounded-full bg-sky-400 inline-block"></span>
                          <span>{group.genre}</span>
                        </div>
                        <div className="bg-sky-100 text-sky-800 border-y border-r border-sky-300 text-[10px] font-bold px-2 py-1 rounded-tr-sm">
                          {group.works.length}冊
                        </div>
                      </div>

                      {/* 本の並び ＋ 紺色の下板 */}
                      <div className="flex flex-wrap items-end gap-2 min-h-[170px] border-b-8 border-slate-900 pb-1 px-1 bg-gradient-to-b from-white to-slate-50/50">
                        {group.works.length === 0 ? (
                          <p className="text-[11px] text-slate-400 m-auto py-8">この棚には作品がありません</p>
                        ) : (
                          group.works.map((work, idx) => {
                            const colorClass = spineColors[idx % spineColors.length];
                            const visibleSceneCount = (work.scenes || []).filter(s => !s.isHidden).length;

                            return (
                              <div
                                key={work.id}
                                onClick={() => openWorkFromShelf(work.id)}
                                title={`${work.title}\nジャンル: ${work.genre || '未設定'}\n（クリックでこの作品のみを開く）`}
                                className={`w-9 sm:w-10 h-36 sm:h-40 ${colorClass} rounded-t-sm shadow-md flex flex-col justify-between items-center py-2 px-0.5 border cursor-pointer hover:-translate-y-2 hover:shadow-xl transition-transform relative select-none`}
                              >
                                <div className="text-[9px] font-bold tracking-tight text-amber-500 drop-shadow-[0_1px_1px_rgba(255,255,255,0.9)] bg-white/70 px-1 py-0.2 rounded-full border border-amber-200">
                                  ★{Number(work.rating) || 0}
                                </div>
                                
                                <div className="vertical-text text-[10px] sm:text-[11px] font-bold leading-none tracking-wider overflow-hidden max-h-24 text-center">
                                  {work.title}
                                </div>

                                <div className="text-[8px] font-semibold bg-white/80 text-sky-800 rounded px-1 shadow-xs border border-sky-200">
                                  {visibleSceneCount}
                                </div>
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  ))
                )}
              </div>
              <p className="text-[10px] text-slate-500 mt-4 text-center">💡 背表紙をタップすると該当の作品のみが表示されます</p>
            </div>
          ) : (
            <>
              {/* 本棚から特定作品を開いた時のナビゲーションバー */}
              {selectedWorkId !== null ? (
                <div className="bg-sky-50 border border-sky-200 rounded-lg p-2.5 mb-3 flex items-center justify-between">
                  <span className="text-xs text-sky-900 font-bold">
                    📖 本棚から選択した作品を表示中
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setViewMode('shelf')}
                      className="text-xs bg-white text-gray-700 border border-gray-300 px-2.5 py-1 rounded font-bold hover:bg-gray-50"
                    >
                      本棚へ戻る
                    </button>
                    <button
                      onClick={() => setSelectedWorkId(null)}
                      className="text-xs bg-blue-600 text-white px-2.5 py-1 rounded font-bold hover:bg-blue-700"
                    >
                      全作品一覧を見る
                    </button>
                  </div>
                </div>
              ) : (
                /* 検索・フィルター・並び替え */
                <div className="bg-white p-3 rounded-lg shadow-sm mb-3 border flex flex-col gap-2">
                  <div className="flex items-center gap-2 border rounded px-2 py-1.5 bg-white">
                    <IconSearch />
                    <input
                      type="text"
                      placeholder="フリーワード検索（タイトル、著者、メモ、Bookmarkなど）..."
                      value={searchWord}
                      onChange={e => setSearchWord(e.target.value)}
                      className="w-full border-none outline-none text-sm"
                    />
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <select value={selectedGenre} onChange={e => setSelectedGenre(e.target.value)} className="w-full p-1.5 text-xs rounded border bg-white">
                      <option value="">すべてのジャンル</option>
                      {allGenres.map(g => <option key={g} value={g}>{g}</option>)}
                    </select>

                    <select value={selectedSite} onChange={e => setSelectedSite(e.target.value)} className="w-full p-1.5 text-xs rounded border bg-white">
                      <option value="">すべての掲載サイト</option>
                      {allSites.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>

                    <select value={selectedTag} onChange={e => setSelectedTag(e.target.value)} className="w-full p-1.5 text-xs rounded border bg-white">
                      <option value="">すべてのタグ</option>
                      {allTags.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>

                    <select value={currentSort} onChange={e => setCurrentSort(e.target.value)} className="w-full p-1.5 text-xs rounded border bg-blue-50/60 font-medium text-blue-900 border-blue-200">
                      <option value="rating-desc">★ 高評価順</option>
                      <option value="rating-asc">★ 低評価順</option>
                      <option value="date-desc">登録が最近の順</option>
                      <option value="date-asc">登録が古い順</option>
                    </select>
                  </div>
                </div>
              )}

              {/* 新規作品登録フォーム */}
              {selectedWorkId === null && (
                <details className="bg-white p-3 rounded-lg shadow-sm mb-3 border">
                  <summary className="font-bold cursor-pointer text-blue-600 text-sm">＋ 新しい作品を登録する</summary>
                  <form onSubmit={addWork} className="flex flex-col gap-2.5 mt-3 text-xs">
                    <div className="flex gap-2">
                      <input type="text" placeholder="作品タイトル（必須）" value={newTitle} onChange={e => setNewTitle(e.target.value)} className="flex-[2] p-2 rounded border text-sm" required />
                      <input type="text" placeholder="著者名" value={newAuthor} onChange={e => setNewAuthor(e.target.value)} className="flex-1 p-2 rounded border text-sm" />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                      <select 
                        value={newGenre} 
                        onChange={e => setNewGenre(e.target.value)} 
                        className="p-2 rounded border text-xs bg-white font-medium"
                      >
                        <option value="">ジャンルを選択 (未分類)</option>
                        {masterGenres.map(g => (
                          <option key={g} value={g}>{g}</option>
                        ))}
                      </select>

                      <div className="flex items-center gap-1.5 border rounded px-2 bg-white">
                        <label className="text-gray-500 font-bold whitespace-nowrap">評価:</label>
                        <select value={newRating} onChange={e => setNewRating(e.target.value)} className="w-full py-1.5 text-xs bg-transparent outline-none font-bold text-yellow-600">
                          <option value="5">★★★★★ (5.0)</option>
                          <option value="4">★★★★☆ (4.0)</option>
                          <option value="3">★★★☆☆ (3.0)</option>
                          <option value="2">★★☆☆☆ (2.0)</option>
                          <option value="1">★☆☆☆☆ (1.0)</option>
                        </select>
                      </div>

                      <input type="text" placeholder="掲載サイト（例：ピッコマ）" value={newSite} onChange={e => setNewSite(e.target.value)} className="p-2 rounded border text-xs" />
                    </div>

                    {/* タグ選択UI */}
                    <div className="flex flex-col gap-1.5 border p-2 rounded bg-gray-50">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-gray-700">作品タグを選択 (タップでON/OFF・複数可):</span>
                        <span className="text-[10px] text-gray-400">{newSelectedTags.length}個選択中</span>
                      </div>

                      <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto p-1 bg-white border rounded">
                        {masterTags.map(tag => {

                          return (
                            <button
                              type="button"
                              key={tag}
                              onClick={() => toggleNewTag(tag)}
                              className={`px-2 py-0.5 rounded text-[11px] transition-colors border ${
                                isSelected 
                                  ? 'bg-blue-600 text-white border-blue-600 font-bold shadow-xs' 
                                  : 'bg-gray-100 text-gray-700 border-gray-300 hover:bg-gray-200'
                              }`}
                            >
                              {isSelected ? '✓ ' : '+ '}#{tag}

                      </div>

                      <div className="flex gap-1.5 mt-1">
                        <input

                          placeholder="新しいタグを作成して追加..."
                          value={newCustomTag}
                          onChange={e => setNewCustomTag(e.target.value)}
                          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addCustomTagToNew(); } }}
                          className="flex-1 p-1 rounded border text-xs bg-white"
                        />
                        <button

                          onClick={addCustomTagToNew} 
                          className="px-2.5 py-1 bg-gray-600 text-white rounded text-xs whitespace-nowrap hover:bg-gray-700"
                        >
                          タグ追加
                        </button>
                      </div>
                    </div>
                    
                    <div className="flex flex-col gap-1">
                      <label className="font-bold text-gray-600">表紙画像を選択 (大容量対応・自動最適化):</label>
                      <input

                        accept="image/*" 
                        onChange={handleImageChange} 
                        className="p-1 border rounded text-xs bg-white"
                      />

                    <option value="rating-asc">★ 低評価順</option>
                    <option value="date-desc">登録が最近の順</option>
                    <option value="date-asc">登録が古い順</option>
                  </select>
                </div>

                {/* ジャンル管理設定 */}
                <div className="flex flex-col gap-1.5 text-xs border-t pt-3">
                  <label className="font-bold text-gray-700">ジャンルの管理:</label>
                  <p className="text-gray-500 text-[11px]">作品登録や本棚の仕分けで使うジャンルを追加・削除できます。</p>
                  
                  <div className="flex gap-1.5 mt-1">
                    <input 
                      type="text" 
                      placeholder="新しいジャンル名..." 
                      value={newMasterGenreInput}
                      onChange={e => setNewMasterGenreInput(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); handleAddMasterGenre(); } }}
                      className="flex-1 p-1.5 border rounded text-xs bg-white"
                    />
                    <button 
                      type="button" 
                      onClick={handleAddMasterGenre} 
                      className="px-3 py-1.5 bg-slate-800 text-white rounded font-bold text-xs"
                    >
                      追加
                    </button>
                  </div>

                  <div className="flex flex-wrap gap-1 max-h-24 overflow-y-auto p-1.5 border rounded bg-gray-50 mt-1">
                    {masterGenres.map(genre => (
                      <span key={genre} className="inline-flex items-center gap-1 bg-white border border-gray-300 px-2 py-0.5 rounded text-[11px] text-gray-700">
                        {genre}
                        <button 
                          type="button" 
                          onClick={() => handleDeleteMasterGenre(genre)} 
                          className="text-gray-400 hover:text-red-500 font-bold ml-0.5"
                          title="削除"
                        >
                          ×
                        </button>
                      </span>
                    ))}
                  </div>
                </div>

                {/* タグ管理設定 */}
                <div className="flex flex-col gap-1.5 text-xs border-t pt-3">
                  <label className="font-bold text-gray-700">タグの管理 (選択候補):</label>
                  <p className="text-gray-500 text-[11px]">作品・Bookmark登録時に選択できるタグを追加・削除できます。</p>
                  
                  <div className="flex gap-1.5 mt-1">
                    <input 
                      type="text" 
                      placeholder="新しいタグ名..." 
                      value={newMasterTagInput}
                      onChange={e => setNewMasterTagInput(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); handleAddMasterTag(); } }}
                      className="flex-1 p-1.5 border rounded text-xs bg-white"
                    />
                    <button 
                      type="button" 
                      onClick={handleAddMasterTag} 
                      className="px-3 py-1.5 bg-blue-600 text-white rounded font-bold text-xs"
                    >
                      追加
                    </button>
                  </div>

                  <div className="flex flex-wrap gap-1 max-h-24 overflow-y-auto p-1.5 border rounded bg-gray-50 mt-1">
                    {masterTags.map(tag => (
                      <span key={tag} className="inline-flex items-center gap-1 bg-white border border-gray-300 px-2 py-0.5 rounded text-[11px] text-gray-700">
                        #{tag}
                        <button 
                          type="button" 
                          onClick={() => handleDeleteMasterTag(tag)} 
                          className="text-gray-400 hover:text-red-500 font-bold ml-0.5"
                          title="削除"
                        >
                          ×
                        </button>
                      </span>
                    ))}
                  </div>
                </div>

                {/* パスワード付き非表示一覧管理エリア */}
                <div className="flex flex-col gap-2 text-xs border-t pt-3 bg-amber-50/70 -mx-4 px-4 py-3 border-amber-200">
                  <label className="font-bold text-amber-900 flex items-center gap-1">
                    <span>🔒 非表示作品・Bookmarkの管理</span>
                  </label>
                  
                  {!isSecretUnlocked ? (
                    <form onSubmit={handleUnlockSecret} className="flex flex-col gap-1.5">
                      <p className="text-amber-800 text-[11px]">パスワードを入力すると、隠した作品やBookmarkの解除ができます。</p>
                      <div className="flex gap-1.5">
                        <input
                          type="password"
                          placeholder="パスワードを入力"
                          value={secretPasswordInput}
                          onChange={e => setSecretPasswordInput(e.target.value)}
                          className="flex-1 p-1.5 border rounded text-xs bg-white"
                        />
                        <button type="submit" className="px-3 py-1 bg-amber-700 text-white rounded font-bold text-xs hover:bg-amber-800">
                          解除
                        </button>
                      </div>
                      {secretPassError && <p className="text-red-600 text-[10px]">パスワードが違います</p>}
                    </form>
                  ) : (
                    <div className="flex flex-col gap-2">
                      <div className="flex gap-1 border-b pb-1">
                        <button
                          type="button"
                          onClick={() => setSecretTab('works')}
                          className={`flex-1 py-1 text-center font-bold text-xs rounded ${secretTab === 'works' ? 'bg-amber-700 text-white' : 'bg-amber-100 text-amber-800'}`}
                        >
                          隠した作品 ({works.filter(w => w.isHidden).length})
                        </button>
                        <button
                          type="button"
                          onClick={() => setSecretTab('scenes')}
                          className={`flex-1 py-1 text-center font-bold text-xs rounded ${secretTab === 'scenes' ? 'bg-amber-700 text-white' : 'bg-amber-100 text-amber-800'}`}
                        >
                          隠したBookmark ({works.flatMap(w => (w.scenes || []).filter(s => s.isHidden)).length})
                        </button>
                      </div>

                      {secretTab === 'works' && (
                        <div className="max-h-40 overflow-y-auto flex flex-col gap-1.5 bg-white p-2 rounded border border-amber-200">
                          {works.filter(w => w.isHidden).length === 0 ? (
                            <p className="text-center text-gray-400 py-3 text-[11px]">非表示の作品はありません</p>
                          ) : (
                            works.filter(w => w.isHidden).map(w => (
                              <div key={w.id} className="flex justify-between items-center bg-gray-50 p-1.5 rounded border text-[11px]">
                                <span className="font-bold truncate max-w-[170px]">{w.title}</span>
                                <button
                                  type="button"
                                  onClick={() => toggleHideWork(w.id)}
                                  className="text-xs text-blue-600 hover:underline flex items-center gap-0.5 font-bold"
                                >
                                  <IconEye /> 再表示
                                </button>
                              </div>
                            ))
                          )}
                        </div>
                      )}

                      {secretTab === 'scenes' && (
                        <div className="max-h-40 overflow-y-auto flex flex-col gap-1.5 bg-white p-2 rounded border border-amber-200">
                          {works.flatMap(w => (w.scenes || []).filter(s => s.isHidden).map(s => ({ workTitle: w.title, workId: w.id, scene: s }))).length === 0 ? (
                            <p className="text-center text-gray-400 py-3 text-[11px]">非表示のBookmarkはありません</p>
                          ) : (
                            works.flatMap(w => (w.scenes || []).filter(s => s.isHidden).map(s => ({ workTitle: w.title, workId: w.id, scene: s }))).map(item => (
                              <div key={item.scene.id} className="flex justify-between items-center bg-gray-50 p-1.5 rounded border text-[11px]">
                                <div className="truncate max-w-[170px]">
                                  <span className="text-[10px] text-gray-500 font-bold block">{item.workTitle}</span>
                                  <span>{item.scene.chapter ? `${item.scene.chapter}話 ` : ''}{item.scene.memo || '(画像/メモ)'}</span>
                                </div>
                                <button
                                  type="button"
                                  onClick={() => toggleHideScene(item.workId, item.scene.id)}
                                  className="text-xs text-blue-600 hover:underline flex items-center gap-0.5 font-bold flex-shrink-0 ml-1"
                                >
                                  <IconEye /> 再表示
                                </button>
                              </div>
                            ))
                          )}
                        </div>
                      )}
                    </div>
                  )}
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t mt-1">
                  <button onClick={() => setIsSettingsOpen(false)} className="px-3 py-1.5 bg-gray-200 text-gray-700 text-xs rounded font-bold">
                    閉じる
                  </button>
                  <button 
                    onClick={() => {
                      const val = document.getElementById('settings-default-sort').value;
                      saveDefaultSettings(val);
                    }} 
                    className="px-3 py-1.5 bg-blue-600 text-white text-xs rounded font-bold hover:bg-blue-700"
                  >
                    設定を保存
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 画像拡大表示モーダル */}
          {previewImageUrl && (
            <div 
              className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 cursor-pointer"
              onClick={() => setPreviewImageUrl(null)}
            >
              <div className="relative max-w-full max-h-full">
                <img src={previewImageUrl} alt="拡大表示" className="max-w-full max-h-[90vh] object-contain rounded" />
                <p className="text-white text-center text-xs mt-2">タップで閉じる</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
