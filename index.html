<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マンガ記録アプリ</title>
  <!-- ReactとTailwind CSSを読み込み -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ★パスワード設定
    const CORRECT_PASSWORD = '3010';

    function App() {
      // パスワード認証状態
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem('manga_log_auth') === 'true';
      });
      const [passwordInput, setPasswordInput] = useState('');
      const [passError, setPassError] = useState(false);

      // データ管理
      const [works, setWorks] = useState(() => {
        const saved = localStorage.getItem('manga_scene_works');
        return saved ? JSON.parse(saved) : [
          {
            id: 1,
            title: '葬送のフリーレン',
            author: '山田鐘人 / アベツカサ',
            image: '',
            site: 'サンデーうぇぶり',
            tags: ['ファンタジー', 'ドラマ'],
            memo: '旅の過程での人間模様が美しい',
            scenes: [
              { id: 101, chapter: '第1話', page: '12p', memo: 'ヒンメルの葬儀でのフリーレンの涙。「なんでもっと知ろうとしなかったんだろう」', tags: ['名言', '感動'] }
            ]
          }
        ];
      });

      // ログイン処理
      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === CORRECT_PASSWORD) {
          setIsAuthenticated(true);
          sessionStorage.setItem('manga_log_auth', 'true');
          setPassError(false);
        } else {
          setPassError(true);
        }
      };

      // ログイン画面
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white p-6 rounded-xl shadow-md w-full max-w-md">
              <h1 className="text-xl font-bold text-center mb-4">🔒 パスワード入力</h1>
              <form onSubmit={handleLogin} className="space-y-4">
                <input
                  type="password"
                  value={passwordInput}
                  onChange={(e) => setPasswordInput(e.target.value)}
                  placeholder="パスワードを入力 (初期: 3010)"
                  className="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                {passError && <p className="text-red-500 text-sm">パスワードが違います</p>}
                <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold">
                  解除する
                </button>
              </form>
            </div>
          </div>
        );
      }

      // メイン画面
      return (
        <div className="min-h-screen bg-gray-50 p-4 max-w-md mx-auto">
          <header className="bg-white p-4 rounded-xl shadow-sm mb-4 border">
            <h1 className="text-xl font-bold text-gray-800">📖 マンガ名シーンログ</h1>
          </header>
          <div className="space-y-4">
            {works.map((work) => (
              <div key={work.id} className="bg-white p-4 rounded-xl shadow-sm border">
                <h2 className="text-lg font-bold text-blue-600">{work.title}</h2>
                <p className="text-sm text-gray-500">{work.author} ({work.site})</p>
                <p className="text-sm mt-2 bg-gray-50 p-2 rounded">{work.memo}</p>
                <div className="mt-3 border-t pt-2">
                  <h3 className="text-xs font-bold text-gray-400 mb-1">記録したシーン</h3>
                  {work.scenes.map(scene => (
                    <div key={scene.id} className="bg-blue-50 p-2 rounded text-sm mb-1">
                      <span className="font-bold">{scene.chapter} {scene.page}</span>: {scene.memo}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
